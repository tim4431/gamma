# The Gamma Cloud account server in production (cloud/deploy/README.md).
#
#   account  the server: ghcr.io/tim4431/gamma-cloud (cloud.yml publishes
#            it when dispatched; a merge to main never does), its data
#            directory on ./data — that
#            directory IS the secret (signing keys, token hashes): back it up
#            encrypted, never share it.
#   share    the free share host: a Gamma (ghcr.io/tim4431/gamma) in cloud
#            mode holding every free account's published pages, its data on
#            ./share-data and its settings in share.env (share.env.example).
#            Reached only through caddy (no host port), whose
#            X-Forwarded-For it believes on this project's network (its
#            subnet pinned below). Pinned to an image tag: bump it with the
#            desktop release.
#   caddy    TLS on the host's own 80/443 with its internal certificate
#            (`tls internal`; Cloudflare holds the public one), for a host
#            with a public address (a VPS). The DNS record for the hostname
#            in .env (CADDY_HOST) must point at the host. Caddy also joins
#            the external network `gamma-edge`, where the public demo — its
#            own compose project, cloud/deploy/demo/ — answers as
#            `gamma-demo`. Create that network once per host before the
#            first `up` (`docker network create --subnet 10.202.0.0/24
#            gamma-edge` — the demo trusts that subnet, demo/README.md):
#            this file refuses to start without it. It joins `gamma-fleet`
#            as well, where every hosted server answers as
#            `gamma-<label>` (`docker network create --subnet
#            10.203.0.0/24 gamma-fleet`, once per host, same rule).
#   fleet    the fleet agent (cloud/fleet/): the Docker socket, the hosted
#            servers' data under /srv/gamma, its host token from .env
#            (GAMMA_FLEET_HOST_TOKEN). Off unless the `fleet` profile is
#            on (COMPOSE_PROFILES=fleet in .env), so a deployment without
#            hosting runs nothing with the socket.
#
# Variants layered with -f: compose.tunnel.yml replaces caddy with a
# Cloudflare Tunnel (no open port; a NAS); compose.build.yml builds the
# image from a copy of the source in ./src instead of pulling it.

services:
  account:
    image: ghcr.io/tim4431/gamma-cloud:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:9002:9002"

  share:
    image: ghcr.io/tim4431/gamma:sha-a0d31c6
    restart: unless-stopped
    env_file: share.env
    environment:
      # Caddy (or the tunnel) reaches it over this project's network, whose
      # subnet is pinned below: its X-Forwarded-For is believed, anyone
      # else's is not (the image trusts loopback only).
      FORWARDED_ALLOW_IPS: 10.201.0.0/24
    volumes:
      - ./share-data:/data
    depends_on:
      - account

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_HOST: ${CADDY_HOST:-account.gammapdf.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - edge
      - fleet
    depends_on:
      - account
      - share

  fleet:
    image: ghcr.io/tim4431/gamma-fleet:latest
    restart: unless-stopped
    profiles: [fleet]
    environment:
      GAMMA_FLEET_ACCOUNT_URL: http://account:9002
      GAMMA_FLEET_HOST_TOKEN: ${GAMMA_FLEET_HOST_TOKEN:-}
      GAMMA_FLEET_NETWORK: gamma-fleet
      GAMMA_FLEET_DATA_ROOT: /srv/gamma
      # the off-site bucket every hosted server copies to, under hosted/<account id>/
      GAMMA_FLEET_S3_BUCKET: ${GAMMA_FLEET_S3_BUCKET:-}
      GAMMA_FLEET_S3_ENDPOINT: ${GAMMA_FLEET_S3_ENDPOINT:-}
      GAMMA_FLEET_S3_REGION: ${GAMMA_FLEET_S3_REGION:-}
      GAMMA_FLEET_S3_ACCESS_KEY: ${GAMMA_FLEET_S3_ACCESS_KEY:-}
      GAMMA_FLEET_S3_SECRET_KEY: ${GAMMA_FLEET_S3_SECRET_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # the same path inside and out: the agent hands it to the daemon as a bind mount
      - /srv/gamma:/srv/gamma
    networks:
      - default
      - fleet
    depends_on:
      - account

volumes:
  caddy-data:
  caddy-config:

networks:
  # Pinned so the share host can trust exactly it (FORWARDED_ALLOW_IPS). A
  # host whose network predates the pin: `docker compose down && docker
  # compose up -d` once recreates it.
  default:
    ipam:
      config:
        - subnet: 10.201.0.0/24
  edge:
    name: gamma-edge
    external: true
  # The hosted servers' network, created by hand with a pinned subnet
  # (10.203.0.0/24) that each server trusts for X-Forwarded-For. External,
  # so a `docker compose down` here never tries to remove it from under
  # the running servers.
  fleet:
    name: gamma-fleet
    external: true
