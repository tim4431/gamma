# The Gamma Cloud account server in production (cloud/deploy/README.md).
#
#   account  the server: ghcr.io/tim4431/gamma-cloud (cloud.yml publishes
#            it when dispatched; a merge to main never does), its data
#            directory on ./data — that
#            directory IS the secret (signing keys, token hashes): back it up
#            encrypted, never share it.
#   share    the free share host: a Gamma (ghcr.io/tim4431/gamma) in cloud
#            mode holding every free account's published pages, its data on
#            ./share-data and its settings in share.env (share.env.example).
#            Reached only through caddy (no host port). Pinned to an image
#            tag: bump it with the desktop release.
#   demo     demo.gammapdf.com: a Gamma in demo mode (docs/dev/guests.md),
#            every visitor a throwaway guest account; its data on
#            ./demo-data (disposable) and its settings in demo.env
#            (demo.env.example). Reached only through caddy (no host port).
#            Pinned to the `sha-<short>` tag of a branch build (docker.yml
#            dispatched on the branch): the update-demo-server skill rewrites
#            the image line in the HOST's copy of this file, so there that
#            line is the truth and may differ from the one below.
#   caddy    TLS on the host's own 80/443 with its internal certificate
#            (`tls internal`; Cloudflare holds the public one), for a host
#            with a public address (a VPS). The DNS record for the hostname
#            in .env (CADDY_HOST) must point at the host.
#
# Variants layered with -f: compose.tunnel.yml replaces caddy with a
# Cloudflare Tunnel (no open port; a NAS); compose.build.yml builds the
# image from a copy of the source in ./src instead of pulling it.

services:
  account:
    image: ghcr.io/tim4431/gamma-cloud:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:9002:9002"

  share:
    image: ghcr.io/tim4431/gamma:sha-a0d31c6
    restart: unless-stopped
    env_file: share.env
    volumes:
      - ./share-data:/data
    depends_on:
      - account

  demo:
    # sha-<short> of the build to run. update-demo-server rewrites this line
    # on the host; the value here is only the first deployment's.
    image: ghcr.io/tim4431/gamma:sha-30586ef
    restart: unless-stopped
    env_file: demo.env
    volumes:
      - ./demo-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_HOST: ${CADDY_HOST:-account.gammapdf.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - account
      - share
      - demo

volumes:
  caddy-data:
  caddy-config:
