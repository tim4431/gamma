# The public demo, demo.gammapdf.com (cloud/deploy/demo/README.md): a Gamma
# (ghcr.io/tim4431/gamma) in demo mode, where every visitor gets a throwaway
# guest account (docs/dev/guests.md). Its own compose project in its own
# folder on the VPS (/root/Container/gamma-demo/), next to the account
# server's but independent of it:
#
#   - the image is main's :latest, kept current by the watchtower service
#     below, as in the repository's docker-compose.yml.example;
#   - its settings are demo.env (demo.env.example), its whole state ./data
#     (disposable);
#   - no host port: the account project's Caddy, which owns 80/443, reaches
#     it as `gamma-demo:9001` over the shared external network `gamma-edge`
#     (`docker network create --subnet 10.202.0.0/24 gamma-edge`, once per
#     host), whose subnet .env names as EDGE_SUBNET: the one address range
#     whose X-Forwarded-For the demo believes.

services:
  demo:
    container_name: gamma-demo
    image: ghcr.io/tim4431/gamma:latest
    restart: unless-stopped
    env_file: demo.env
    environment:
      # Caddy's X-Forwarded-For (the visitor, from CF-Connecting-IP) is
      # believed from gamma-edge's subnet only — the image trusts loopback
      # only. Without it every visitor shares Caddy's guest-login limit.
      FORWARDED_ALLOW_IPS: ${EDGE_SUBNET:?set EDGE_SUBNET in .env to gamma-edge's subnet (docker network inspect gamma-edge)}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: demo
    volumes:
      - ./data:/data
    networks:
      edge:
        aliases:
          - gamma-demo

  # Keeps the demo on main's newest image: Watchtower polls GHCR every hour,
  # pulls a new :latest and recreates the demo, which upgrades ./data as it
  # starts (snapshot first). Chosen by the labels above rather than by
  # name, since a name argument also matches one character more (the fleet's
  # gamma-<label> servers share this host). The scope keeps it apart from
  # the share host's Watchtower in the account project: an unscoped one
  # updates every labelled container and stops every other Watchtower when
  # it starts. DOCKER_API_VERSION: the archived image's client defaults to
  # an API that Docker 29 refuses.
  watchtower:
    container_name: gamma-demo-watchtower
    image: containrrr/watchtower
    environment:
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --label-enable --scope demo --interval 3600
    restart: unless-stopped

networks:
  edge:
    name: gamma-edge
    external: true
