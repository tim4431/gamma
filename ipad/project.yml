# Gamma for iPad — the Xcode project, generated by XcodeGen:
#   cd ipad && xcodegen generate && open GammaIPad.xcodeproj
# (ipad/README.md). The app's JavaScript is the web app's own modules,
# bundled into GammaIPad/Resources/gamma-core.js before every build.
name: GammaIPad
options:
  bundleIdPrefix: net.gammapdf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # the bundle step reads the frontend's node_modules
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  GammaIPad:
    type: application
    platform: iOS
    sources:
      - path: GammaIPad
        excludes:
          - "Resources/gamma-core.js"
      - path: GammaIPad/Resources/gamma-core.js
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gammapdf.ipad
        PRODUCT_NAME: Gamma
        INFOPLIST_FILE: GammaIPad/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: GammaIPad/Info.plist
      properties:
        CFBundleDisplayName: Gamma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Gamma connects to your Gamma server when it runs on your local network.
        ITSAppUsesNonExemptEncryption: false
    preBuildScripts:
      - name: Bundle the shared JavaScript
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/GammaIPad/Resources/gamma-core.js
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if command -v node >/dev/null 2>&1; then
            node "$SRCROOT/scripts/build-core.mjs"
          elif [ -f "$SRCROOT/GammaIPad/Resources/gamma-core.js" ]; then
            echo "warning: node not found; using the gamma-core.js built before"
          else
            echo "error: Node is needed to bundle gamma-core.js (run: node ipad/scripts/build-core.mjs)"
            exit 1
          fi
  GammaIPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GammaIPadTests
    dependencies:
      - target: GammaIPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.gammapdf.ipad.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Gamma.app/Gamma
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  GammaIPad:
    build:
      targets:
        GammaIPad: all
        GammaIPadTests: [test]
    test:
      targets:
        - GammaIPadTests
