# Gamma for iPad — the Xcode project, generated by XcodeGen:
#   bash ipad/scripts/build-python.sh && cd ipad && xcodegen generate && open GammaIPad.xcodeproj
# (ipad/README.md). The app is a shell over a Gamma server's own web app,
# and it carries a server of its own: CPython 3.13 (Python.xcframework)
# running the backend, with the built web app it serves. build-python.sh
# makes all of that (gitignored): it has to run once from a shell before the
# first build, because Xcode reads Python.xcframework when it plans a build;
# after that the pre-build phase below keeps it current.
name: GammaIPad
options:
  bundleIdPrefix: net.gammapdf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Python.h, as the CPython iOS guide sets it up
    # (https://docs.python.org/3/using/ios.html). On both targets: the tests
    # import the app's module, whose bridging header includes Python.h.
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)"
    HEADER_SEARCH_PATHS: "$(inherited) \"$(BUILT_PRODUCTS_DIR)/Python.framework/Headers\""
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
targets:
  GammaIPad:
    type: application
    platform: iOS
    sources:
      - path: GammaIPad
        # Not a resource: the run script below copies it into the bundle.
        excludes:
          - "Resources/python"
          - "Resources/python/**"
    dependencies:
      # Embed & Sign, as the guide says; the binary modules of the standard
      # library and of the wheels become frameworks of their own in the run
      # script below.
      - framework: Python.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gammapdf.ipad
        PRODUCT_NAME: Gamma
        INFOPLIST_FILE: GammaIPad/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Relative to the project directory (ipad/).
        SWIFT_OBJC_BRIDGING_HEADER: GammaIPad/Server/GammaIPad-Bridging-Header.h
        # The scripts read the framework and the repository and write into
        # the bundle, which the sandbox for build scripts does not allow.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      # Quick when nothing changed (it is stamped and cached): the server's
      # code, its wheels and the web app follow the repository.
      - name: Prepare Python and the server
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Through bash: the script's executable bit does not survive a
          # commit from a Windows checkout.
          bash "$PROJECT_DIR/scripts/build-python.sh"
    postBuildScripts:
      # XcodeGen puts this after Copy Bundle Resources and Embed Frameworks.
      # That order is fine: install_python signs each framework it makes
      # itself, as does the PyMuPDF step after it, and the app is signed
      # after every phase, over all of them.
      - name: Install Python into the bundle
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -e
          resources="$PROJECT_DIR/GammaIPad/Resources/python"
          python="$CODESIGNING_FOLDER_PATH/python"
          if [ ! -f "$PROJECT_DIR/Python.xcframework/build/utils.sh" ] || [ ! -d "$resources/app" ] ||
             [ ! -d "$resources/frontend_dist" ]; then
            echo "error: Python.xcframework or Resources/python is missing: run bash ipad/scripts/build-python.sh"
            exit 1
          fi
          # install_python copies the standard library's lib-$ARCHS folder:
          # one architecture only (CI passes ONLY_ACTIVE_ARCH=YES ARCHS=arm64
          # for the simulator; Xcode's own Run builds the active one).
          case "$ARCHS" in
            *" "*)
              echo "error: install_python needs one architecture, not \"$ARCHS\": build with ONLY_ACTIVE_ARCH=YES (and ARCHS=arm64 for the simulator)"
              exit 1
              ;;
          esac
          if [ ! -d "$resources/app_packages.$PLATFORM_NAME" ]; then
            echo "error: no wheels for $PLATFORM_NAME in Resources/python: run bash ipad/scripts/build-python.sh"
            exit 1
          fi
          # Copied here on every build rather than as a folder reference in
          # Copy Bundle Resources: Xcode tracks such a folder as one item and
          # does not reliably copy it again when only files deep inside it
          # change, so an incremental build could ship old server code, wheels
          # or web app. rsync copies only what changed, and --delete also drops
          # the .fwork markers of the last build, so the wheels' .so files and
          # dylibs come back and install_python, then the PyMuPDF step after
          # it, turn them into frameworks again. The wheels for the platform
          # built become python/app_packages.
          mkdir -p "$python"
          rsync -a --delete "$resources/app/" "$python/app/"
          rsync -a --delete "$resources/frontend_dist/" "$python/frontend_dist/"
          rsync -a --delete --exclude .gamma-stamp "$resources/app_packages.$PLATFORM_NAME/" "$python/app_packages/"
          # Unsigned builds (CI's CODE_SIGNING_ALLOWED=NO) have no identity,
          # and codesign needs one: "-" signs ad hoc.
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          source "$PROJECT_DIR/Python.xcframework/build/utils.sh"
          # The standard library into python/lib, then every .so of it and of
          # the wheels into Frameworks/<module>.framework, as iOS requires.
          install_python Python.xcframework python/app_packages
          # PyMuPDF's wheel carries MuPDF as two plain dylibs beside its
          # extension modules (app_packages/pymupdf/libmupdf.dylib and
          # libmupdfcpp.dylib). install_python converts .so files only, and iOS
          # loads native code from signed frameworks alone, so each dylib
          # becomes Frameworks/pymupdf.<lib>.framework/pymupdf.<lib>, named as
          # install_python names a module's framework. That is the name the
          # wheel already uses: mobile-forge gave the dylibs the install name
          # @rpath/pymupdf.libmupdf.framework/pymupdf.libmupdf, and _mupdf.so,
          # _extra.so and libmupdfcpp.dylib reference them so. The id and the
          # references are set here all the same, from the id each dylib came
          # with, so a wheel built with bare names would work too. A .fwork
          # marker is left where each dylib was, as install_python leaves one
          # for a .so: pymupdf's __init__ reads it and loads the framework's
          # binary before it imports _extra, and the @rpath references also
          # resolve on their own through the app's @executable_path/Frameworks,
          # as @rpath/Python.framework/Python does for every extension module.
          # The rsync above brings the dylibs back on each build, so this runs
          # on each build; a wheel without them makes it a no-op
          # (docs/research/pymupdf-ios.md).
          frameworks="$CODESIGNING_FOLDER_PATH/Frameworks"
          case "$PLATFORM_NAME" in
            iphonesimulator) platform=iPhoneSimulator ;;
            *) platform=iPhoneOS ;;
          esac
          old_ids=() new_ids=() made=0
          for dylib in "$python"/app_packages/pymupdf/libmupdf*.dylib; do
            [ -f "$dylib" ] || continue
            lib=$(basename "$dylib" .dylib)
            name="pymupdf.$lib"
            folder="$frameworks/$name.framework"
            echo "Creating framework for python/app_packages/pymupdf/$lib.dylib"
            # otool -D prints the file's name, then its install name.
            old_ids+=("$(otool -D "$dylib" | tail -n 1)")
            new_ids+=("@rpath/$name.framework/$name")
            made=$((made + 1))
            mkdir -p "$folder"
            mv "$dylib" "$folder/$name"
            echo "Frameworks/$name.framework/$name" > "${dylib%.dylib}.fwork"
            echo "python/app_packages/pymupdf/$lib.fwork" > "$folder/$name.origin"
            cat > "$folder/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$name</string>
            <key>CFBundleIdentifier</key>
            <string>$PRODUCT_BUNDLE_IDENTIFIER.$name</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$name</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundleSupportedPlatforms</key>
            <array>
              <string>$platform</string>
            </array>
            <key>MinimumOSVersion</key>
            <string>17.0</string>
          </dict>
          </plist>
          EOF
            install_name_tool -id "@rpath/$name.framework/$name" "$folder/$name"
          done
          # The references between the four binaries (libmupdfcpp needs
          # libmupdf; the extension modules, now in the frameworks their .fwork
          # markers name, need both), then a signature for each, since
          # install_name_tool undoes the one a binary had. Signed as
          # install_python signs its frameworks.
          if [ "$made" -gt 0 ]; then
            for fwork in "$python"/app_packages/pymupdf/*.fwork; do
              binary="$CODESIGNING_FOLDER_PATH/$(cat "$fwork")"
              i=0
              while [ "$i" -lt "${#old_ids[@]}" ]; do
                install_name_tool -change "${old_ids[$i]}" "${new_ids[$i]}" "$binary"
                i=$((i + 1))
              done
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" ${OTHER_CODE_SIGN_FLAGS:-} \
                -o runtime --timestamp=none --preserve-metadata=identifier,entitlements,flags \
                --generate-entitlement-der "$(dirname "$binary")"
            done
          fi
          # A dylib still lying loose in the bundle would fail at dlopen on a
          # device and at App Store validation (ITMS-90171): better a failed
          # build.
          loose=$(find "$python/app_packages" -name '*.dylib' -type f)
          if [ -n "$loose" ]; then
            echo "error: dynamic libraries left loose in the bundle, which iOS does not load: $loose"
            exit 1
          fi
    info:
      path: GammaIPad/Info.plist
      properties:
        CFBundleDisplayName: Gamma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Gamma Cloud sign-in's sheet closes on gamma-ipad://cloud-signin
        # (Shell/CloudSignIn.swift).
        CFBundleURLTypes:
          - CFBundleURLName: net.gammapdf.ipad.cloud-signin
            CFBundleURLSchemes:
              - gamma-ipad
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Gamma connects to your Gamma server when it runs on your local network.
        # The app's Documents folder in Files (On My iPad > Gamma), where the
        # local server keeps its data directory and its log (Documents/Gamma/local,
        # Server/LocalServer.swift), as the desktop shows its data folder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The web app's recordings (getUserMedia in the web view).
        NSMicrophoneUsageDescription: Gamma records audio for the recordings you make with your notes.
        # A file picker in the web view offers the camera, and the share
        # sheet offers to save an exported image: both end the app without
        # these strings.
        NSCameraUsageDescription: Gamma uses the camera when you take a photo to add to a page.
        NSPhotoLibraryAddUsageDescription: Gamma saves the images you export to your photo library.
        ITSAppUsesNonExemptEncryption: false
  GammaIPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GammaIPadTests
    dependencies:
      - target: GammaIPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.gammapdf.ipad.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Gamma.app/Gamma
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  GammaIPad:
    build:
      targets:
        GammaIPad: all
        GammaIPadTests: [test]
    test:
      targets:
        - GammaIPadTests
