name: GammaIPad
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GammaIPad:
    type: application
    platform: iOS
    sources: [GammaIPad]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamma.reader.ipad
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gamma
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: PencilKit.framework
      - sdk: WebKit.framework
  GammaIPadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GammaIPadTests]
    dependencies:
      - target: GammaIPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gamma.reader.ipad.tests
  GammaIPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GammaIPadUITests]
    dependencies:
      - target: GammaIPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gamma.reader.ipad.uitests
        TEST_TARGET_NAME: GammaIPad
schemes:
  GammaIPad:
    build:
      targets:
        GammaIPad: all
        GammaIPadTests: [test]
        GammaIPadUITests: [test]
    test:
      targets: [GammaIPadTests, GammaIPadUITests]
      gatherCoverageData: true
