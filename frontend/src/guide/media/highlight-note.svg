<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- A highlight becomes a note: the pointer drags along a sentence on the
       paper and the selection grows under it, at the pointer's pace. Let go,
       and the colour popup opens just under where the button came up
       (pdf/selectionTip.js, the release point); a press on its first colour
       makes the highlight. The popup closes, the highlight takes that
       colour, and a note block for it lands at the end of Notes: a dot in
       the highlight's colour, the sentence quoted under it (blockModel
       addHighlightAsBlock, BlockTree's .blockQuote). The accent is that one
       thread: the sentence, its colour, the link to its note. Every sheet
       stops short of its pane, so each edge reads. -->

  <!-- the paper: two paragraphs, the second ending in the sentence, a figure -->
  <rect class="m-well" x="12" y="12" width="188" height="176" rx="6" />
  <rect class="m-card" x="28" y="20" width="156" height="160" rx="2" />
  <rect class="m-line" x="40" y="32" width="80" height="5" rx="2.5" />
  <rect class="m-line-dim" x="40" y="44" width="132" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="51" width="126" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="58" width="132" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="65" width="96" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="78" width="132" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="85" width="128" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="92" width="132" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="99" width="100" height="3" rx="1.5" />
  <rect class="m-well" x="40" y="112" width="56" height="34" rx="2" />
  <path class="m-glyph" d="M46 139L56 129L66 133L77 121L90 126" />
  <rect class="m-line-dim" x="104" y="114" width="68" height="3" rx="1.5" />
  <rect class="m-line-dim" x="104" y="121" width="62" height="3" rx="1.5" />
  <rect class="m-line-dim" x="104" y="128" width="68" height="3" rx="1.5" />
  <rect class="m-line-dim" x="104" y="135" width="64" height="3" rx="1.5" />
  <rect class="m-line-dim" x="104" y="142" width="40" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="156" width="132" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="163" width="126" height="3" rx="1.5" />
  <rect class="m-line-dim" x="40" y="170" width="90" height="3" rx="1.5" />

  <!-- Notes: its title row, the notes so far, the new block at the end -->
  <rect class="m-card" x="208" y="12" width="100" height="176" rx="6" />
  <path class="m-glyph" d="M215 18h.01M218 18h.01M215 21h.01M218 21h.01M215 24h.01M218 24h.01" />
  <rect class="m-line" x="224" y="19" width="26" height="4" rx="2" />
  <path class="m-rule" d="M208 30H308" />
  <rect class="m-line-dim" x="224" y="40.5" width="72" height="3" rx="1.5" />
  <rect class="m-line-dim" x="232" y="52.5" width="60" height="3" rx="1.5" />
  <rect class="m-line-dim" x="232" y="64.5" width="48" height="3" rx="1.5" />
  <rect class="m-line-dim" x="224" y="76.5" width="66" height="3" rx="1.5" />
  <rect class="m-line-dim" x="224" y="88.5" width="50" height="3" rx="1.5" />
  <g class="m-appear" style="--m-at: 0.58">
    <rect class="m-line-dim" x="224" y="102.5" width="20" height="3" rx="1.5" />
    <rect class="m-chip" x="216" y="110" width="84" height="24" rx="3" />
    <rect class="m-line" x="216" y="110" width="2.5" height="24" rx="1" />
    <rect class="m-line-dim" x="223" y="116" width="70" height="3" rx="1.5" />
    <rect class="m-line-dim" x="223" y="123" width="44" height="3" rx="1.5" />
  </g>

  <!-- the selection, drawn with the drag; the colour sets it -->
  <path class="m-mark m-draw m-quick" pathLength="1" style="--m-at: 0.15" d="M64 100.5H140" />
  <path class="m-mark m-light" style="--m-at: 0.46" d="M64 100.5H140" />

  <!-- the colour popup under the release point, its first colour pressed -->
  <g class="m-leave" style="--m-at: 0.5">
    <g class="m-appear" style="--m-at: 0.28">
      <rect class="m-card" x="112" y="106" width="56" height="16" rx="4" />
      <circle class="m-line-dim" cx="121" cy="114" r="4.5" />
      <circle class="m-line-dim" cx="133" cy="114" r="4.5" />
      <circle class="m-line-dim" cx="145" cy="114" r="4.5" />
      <circle class="m-line-dim" cx="157" cy="114" r="4.5" />
      <circle class="m-chip-on m-light" style="--m-at: 0.44" cx="121" cy="114" r="4.5" />
    </g>
  </g>

  <!-- the link to the note, ending at its dot -->
  <path class="m-link m-draw" pathLength="1" style="--m-at: 0.5" d="M142 100.5C182 100.5 186 104 215 104" />
  <circle class="m-chip-on m-light" style="--m-at: 0.58" cx="218" cy="104" r="2.6" />

  <!-- the hand: in to the sentence, along it, back to the first colour -->
  <circle class="m-ripple m-press" style="--m-at: 0.13" cx="64" cy="100.5" r="7" />
  <circle class="m-ripple m-press" style="--m-at: 0.44" cx="121" cy="114" r="6.5" />
  <g class="m-move" style="--m-at: 0.33; --m-dx: 19; --m-dy: -13.5">
    <g class="m-move" style="--m-at: 0.15; --m-dx: -76; --m-dy: 0">
      <g class="m-move" style="--m-at: 0.02; --m-dx: 56; --m-dy: 69.5">
        <g transform="translate(119.76 112.76) scale(0.62)">
          <path class="m-pointer" d="M2 2 L2 20 L7 15.5 L10.5 23 L14 21.5 L10.5 14 L17 14 Z" />
        </g>
      </g>
    </g>
  </g>
</svg>
