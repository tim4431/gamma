<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- Write in the bottom of the last page and the next one is already
       there. The dashed band is that bottom quarter (guide/media.js,
       docs/dev/notebooks.md). -->
  <style>
    [data-media="notebook-pages"] .sheet { fill: var(--bg-surface); stroke: var(--border); }
    [data-media="notebook-pages"] .rule { stroke: var(--border-subtle); stroke-width: 1; }
    [data-media="notebook-pages"] .band { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1;
      stroke-dasharray: 4 4; opacity: 0.85; }
    [data-media="notebook-pages"] .ink { stroke: var(--text-primary); stroke-width: 2.2; fill: none;
      stroke-linecap: round; stroke-linejoin: round; }
    [data-media="notebook-pages"] .no { fill: var(--text-dim); opacity: 0.6; }
    [data-media="notebook-pages"] .stroke1 { stroke-dasharray: 120; animation: npInk 4.6s ease-in-out infinite; }
    [data-media="notebook-pages"] .next { animation: npNext 4.6s ease-in-out infinite; }
    [data-media="notebook-pages"] .bandBeat { animation: npBand 4.6s ease-in-out infinite; }
    @keyframes npInk {
      0%, 10% { stroke-dashoffset: 120; }
      44%, 88% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 120; }
    }
    @keyframes npNext {
      0%, 46% { opacity: 0; transform: translateY(14px); }
      66%, 88% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }
    @keyframes npBand {
      0%, 8% { opacity: 0.25; }
      30%, 52% { opacity: 0.9; }
      74%, 100% { opacity: 0.25; }
    }
  </style>

  <!-- the last page, with its bottom quarter marked -->
  <rect class="sheet" x="88" y="14" width="144" height="118" rx="5" stroke-width="1" />
  <path class="rule" d="M98 32h124M98 46h124M98 60h124M98 74h124M98 88h124M98 102h124M98 116h124" />
  <rect class="band bandBeat" x="92.5" y="96.5" width="135" height="31" rx="3" />
  <path class="ink stroke1" d="M108 118c10-14 17 6 27-6s16 8 26-4 16 7 25-3" />
  <text class="no" x="222" y="127" font-size="9" text-anchor="end">1</text>

  <!-- so the next page is waiting below -->
  <g class="next">
    <rect class="sheet" x="88" y="140" width="144" height="50" rx="5" stroke-width="1" />
    <path class="rule" d="M98 156h124M98 170h124M98 184h124" />
    <text class="no" x="222" y="186" font-size="9" text-anchor="end">2</text>
  </g>
</svg>
