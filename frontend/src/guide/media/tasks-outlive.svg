<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- The work is the server's: with the tasks tray open, a job's bar
       fills. The pointer closes the tab, and the window goes; below it the
       server's lights keep blinking, still at it. A new tab comes back, the
       pointer opens the tray, and the same job's bar has run on past where
       it was: closing Gamma did not stop it (tasks/TasksTray.jsx: the tray
       button, then each job's row with its bar). -->

  <!-- the server, under the window, working throughout -->
  <path class="m-rule" d="M160 138V152" />
  <rect class="m-card" x="136" y="152" width="48" height="34" rx="4" />
  <path class="m-rule" d="M136 163.5H184M136 174.5H184" />
  <circle class="m-line-dim" cx="142" cy="158" r="1.5" />
  <circle class="m-line-dim" cx="142" cy="169" r="1.5" />
  <circle class="m-line-dim" cx="142" cy="180" r="1.5" />
  <circle class="m-chip-on m-blink" style="--m-at: 0.28" cx="176" cy="158" r="2" />
  <circle class="m-chip-on m-blink" style="--m-at: 0.36" cx="176" cy="169" r="2" />
  <circle class="m-chip-on m-blink" style="--m-at: 0.44" cx="176" cy="180" r="2" />

  <!-- the first window, the tray open, the job's bar filling; closed -->
  <g class="m-leave" style="--m-at: 0.27">
    <rect class="m-card" x="10" y="10" width="300" height="128" rx="6" />
    <rect class="m-chip" x="16" y="14" width="92" height="14" rx="4" />
    <rect class="m-line-dim" x="22" y="19.25" width="52" height="3.5" rx="1.75" />
    <path class="m-glyph" d="M97 18.5l5 5M102 18.5l-5 5" />
    <path class="m-rule" d="M10 32H310" />
    <circle class="m-glyph" cx="290" cy="21" r="4.5" />
    <path class="m-glyph-on" d="M290 16.5a4.5 4.5 0 0 1 4.5 4.5" />
    <rect class="m-line" x="22" y="42" width="60" height="5" rx="2.5" />
    <rect class="m-line-dim" x="22" y="56" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="63" width="118" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="70" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="77" width="90" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="88" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="95" width="124" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="102" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="109" width="70" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="120" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="127" width="100" height="3.5" rx="1.75" />
      <rect class="m-card" x="168" y="38" width="134" height="56" rx="6" />
      <rect class="m-line" x="176" y="46" width="58" height="4" rx="2" />
      <rect class="m-line-dim" x="176" y="54" width="86" height="3" rx="1.5" />
      <rect class="m-chip" x="176" y="65" width="118" height="8" rx="4" />
      <path class="m-glyph" d="M177 82l2 2 4-4" />
      <rect class="m-line-dim" x="188" y="80.5" width="60" height="3" rx="1.5" />
      <path class="m-link m-draw" pathLength="1" style="--m-at: 0.02" d="M179 69H222" />
  </g>

  <!-- the tab back, and in the tray the same job, further on -->
  <g class="m-appear" style="--m-at: 0.4">
    <rect class="m-card" x="10" y="10" width="300" height="128" rx="6" />
    <rect class="m-chip" x="16" y="14" width="92" height="14" rx="4" />
    <rect class="m-line-dim" x="22" y="19.25" width="46" height="3.5" rx="1.75" />
    <path class="m-glyph" d="M97 18.5l5 5M102 18.5l-5 5" />
    <path class="m-rule" d="M10 32H310" />
    <circle class="m-glyph" cx="290" cy="21" r="4.5" />
    <path class="m-glyph-on" d="M290 16.5a4.5 4.5 0 0 1 4.5 4.5" />
    <rect class="m-line" x="22" y="42" width="60" height="5" rx="2.5" />
    <rect class="m-line-dim" x="22" y="56" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="63" width="118" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="70" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="77" width="90" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="88" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="95" width="124" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="102" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="109" width="70" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="120" width="130" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="22" y="127" width="100" height="3.5" rx="1.75" />
    <g class="m-appear" style="--m-at: 0.58">
      <rect class="m-card" x="168" y="38" width="134" height="56" rx="6" />
      <rect class="m-line" x="176" y="46" width="58" height="4" rx="2" />
      <rect class="m-line-dim" x="176" y="54" width="86" height="3" rx="1.5" />
      <rect class="m-chip" x="176" y="65" width="118" height="8" rx="4" />
      <path class="m-glyph" d="M177 82l2 2 4-4" />
      <rect class="m-line-dim" x="188" y="80.5" width="60" height="3" rx="1.5" />
      <path class="m-link" d="M179 69H222" />
      <path class="m-link m-draw" pathLength="1" style="--m-at: 0.6" d="M222 69H284" />
    </g>
  </g>

  <!-- the presses: the tab's close, then the tray button -->
  <circle class="m-ripple m-press" style="--m-at: 0.23" cx="99.5" cy="21" r="7" />
  <circle class="m-ripple m-press" style="--m-at: 0.55" cx="290" cy="21" r="7" />

  <g class="m-move" style="--m-at: 0.44; --m-dx: -190.5; --m-dy: 0">
  <g class="m-move" style="--m-at: 0.12; --m-dx: -39.5; --m-dy: 161">
    <g transform="translate(288.76 19.76) scale(0.62)"><path class="m-pointer" d="M2 2 L2 20 L7 15.5 L10.5 23 L14 21.5 L10.5 14 L17 14 Z" /></g>
  </g></g>
</svg>
