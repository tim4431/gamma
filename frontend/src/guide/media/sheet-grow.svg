<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- Pages add themselves as you write: in the notes, the lower half of a
       ruled sheet of paper (A4, its top out of sight), the blocks after it
       below. The pointer writes a line, which ends above the sheet's bottom
       quarter and adds nothing, then the next, which is in it. As that
       stroke lands the next sheet comes in right after the first, on the
       same ruled paper, and the blocks after move down out of its way. The
       accent is that new sheet (useInkStrokes.js, notebook.js
       wantsSheetAfter: a stroke whose bounds reach below three quarters of
       the last sheet adds the next one once; insertSheetAfter, paperBefore).
       Here the sheet is 140 by 198 with its bottom at 118, so the quarter
       starts at 68.5: the first line sits on 64, the second on 82. -->

  <!-- the notes view, the sheet running up out of sight -->
  <rect class="m-card" x="62" y="10" width="196" height="180" rx="10" />
  <path class="m-card" d="M84 10V116a2 2 0 0 0 2 2h136a2 2 0 0 0 2-2V10" />
  <path class="m-rule" d="M84 28H224M84 46H224M84 64H224M84 82H224M84 100H224" />

  <!-- what is written already -->
  <path class="m-ink" d="M90 28c2.7 0 5.8 -9.2 4.6 -9.2c-1.2 0 -2.8 9.2 -.2 9.2c3 0 5 -4.4 3.8 -4.4c-1.2 0 -1.5 4.4 1.5 4.4M104.7 28c3.1 0 6.4 -9.6 5 -9.6c-1.4 0 -3 9.6 .1 9.6c1 0 3 -4.9 3.5 -4.9c.5 0 0 4.9 1 4.9c1 0 3 -4.5 3.6 -4.5c.6 0 .2 4.5 1.2 4.5M124.1 28c1.1 0 3.1 -4.6 3.7 -4.6c.6 0 .2 4.6 1.3 4.6c2.8 0 1.9 6.6 .8 6.6c-1.2 0 1.4 -6.6 4.2 -6.6M139.1 28c1.1 0 3.1 -4.5 3.7 -4.5c.6 0 .2 4.5 1.3 4.5c1.1 0 3.2 -5 3.8 -5c.6 0 .2 5 1.3 5c1 0 2.9 -4.6 3.4 -4.6c.5 0 0 4.6 1 4.6M158.6 28c2.8 0 5.8 -8.5 4.6 -8.5c-1.3 0 -2.7 8.5 .2 8.5c1.2 0 4.2 -7.9 4.7 -7.9c.5 0 -.6 7.9 .6 7.9M173.6 28c1.2 0 4.1 -7.8 4.6 -7.8c.5 0 -.7 7.8 .5 7.8c1.2 0 3.2 -4.2 3.8 -4.2c.6 0 .4 4.2 1.6 4.2c1.1 0 3.3 -5 3.9 -5c.6 0 .2 5 1.3 5c2.7 0 1.6 7.5 .5 7.5c-1.1 0 1.6 -7.5 4.4 -7.5c1.1 0 3.8 -7.4 4.2 -7.4c.5 0 -.7 7.4 .4 7.4" />
  <path class="m-ink" d="M90 46c1.2 0 3 -4.1 3.3 -4.1c.3 0 0 4.1 1.2 4.1c2.5 0 4.4 -4.3 3.3 -4.3c-1 0 -1.4 4.3 1.1 4.3c1.1 0 3.2 -4.6 3.8 -4.6c.6 0 .3 4.6 1.4 4.6M109.1 46c2.7 0 6.2 -10.2 4.9 -10.2c-1.2 0 -3.1 10.2 -.4 10.2c1.1 0 3 -4.2 3.6 -4.2c.6 0 .3 4.2 1.4 4.2c2.8 0 4.9 -4.8 3.7 -4.8c-1.2 0 -1.6 4.8 1.2 4.8M128.6 46c1.1 0 3.1 -4.7 3.7 -4.7c.6 0 .2 4.7 1.2 4.7c2.8 0 6.3 -10.2 5 -10.2c-1.3 0 -3.1 10.2 -.3 10.2c2.8 0 4.7 -4.1 3.5 -4.1c-1.2 0 -1.4 4.1 1.4 4.1c1.2 0 3.1 -4.1 3.4 -4.1c.3 0 0 4.1 1.3 4.1c3.2 0 6.8 -10.3 5.4 -10.3c-1.4 0 -3.2 10.3 0 10.3M158.2 46c1.1 0 3.1 -4.9 3.7 -4.9c.6 0 .1 4.9 1.2 4.9c1.3 0 3.4 -4.7 3.7 -4.7c.3 0 -.1 4.7 1.2 4.7c2.6 0 4.5 -4.2 3.4 -4.2c-1.1 0 -1.4 4.2 1.2 4.2c1.2 0 3.2 -4.6 3.5 -4.6c.3 0 -.2 4.6 1 4.6" />

  <!-- the pointer writes a line, still above the bottom quarter, then the
       next one, which is in it -->
  <path class="m-ink m-draw" pathLength="1" style="--m-at: 0.02" d="M90 64c1.4 0 3.4 -4.1 3.8 -4.1c.4 0 .2 4.1 1.6 4.1c2.8 0 4.8 -4.5 3.6 -4.5c-1.1 0 -1.5 4.5 1.3 4.5c3.1 0 6.4 -9.4 5 -9.4c-1.4 0 -3 9.4 .1 9.4c1.5 .8 3.1 .8 5 0c1.1 0 3.1 -4.4 3.7 -4.4c.6 0 .3 4.4 1.4 4.4c2.8 0 4.7 -4.4 3.6 -4.4c-1.1 0 -1.5 4.4 1.3 4.4c1.5 .8 3.1 .8 5 0c1.1 0 3 -4.2 3.6 -4.2c.6 0 .3 4.2 1.4 4.2c2.8 0 6 -9.5 4.8 -9.5c-1.2 0 -2.9 9.5 -.2 9.5c1.4 0 3.4 -4.3 3.7 -4.3c.3 0 .1 4.3 1.5 4.3c2.7 0 4.6 -4.1 3.5 -4.1c-1.1 0 -1.4 4.1 1.3 4.1c1.5 .8 3.1 .8 5 0c1.2 0 4 -7.2 4.5 -7.2c.5 0 -.5 7.2 .7 7.2c2.9 0 4.9 -4.2 3.7 -4.2c-1.2 0 -1.4 4.2 1.5 4.2c1 0 3.1 -5 3.6 -5c.5 0 0 5 1 5c1.2 0 3.2 -4.6 3.5 -4.6c.3 0 -.1 4.6 1.2 4.6c1.5 .8 3.1 .8 5 0c2.6 0 6 -9.9 4.8 -9.9c-1.2 0 -3 9.9 -.4 9.9c2.9 0 4.9 -4.4 3.7 -4.4c-1.2 0 -1.5 4.4 1.5 4.4c2.9 0 5 -4.5 3.8 -4.5c-1.2 0 -1.5 4.5 1.4 4.5c1 0 2.8 -4.1 3.3 -4.1c.5 0 .2 4.1 1.1 4.1" />
  <path class="m-ink m-draw" pathLength="1" style="--m-at: 0.34" d="M90 82c2.9 0 6.2 -9.5 4.9 -9.5c-1.3 0 -3 9.5 0 9.5c1.3 0 4.2 -7.9 4.7 -7.9c.5 0 -.6 7.9 .6 7.9c3 0 5.1 -4.7 3.8 -4.7c-1.2 0 -1.6 4.7 1.4 4.7c1 0 2.9 -4.6 3.4 -4.6c.5 0 .1 4.6 1 4.6c1.5 .8 3.1 .8 5 0c1 0 3 -4.7 3.5 -4.7c.5 0 .1 4.7 1 4.7c1.3 0 3.4 -4.7 3.7 -4.7c.3 0 -.1 4.7 1.3 4.7c2.8 0 5.8 -8.5 4.6 -8.5c-1.3 0 -2.7 8.5 .2 8.5c1.5 .8 3.1 .8 5 0c1.2 0 3.2 -4.6 3.5 -4.6c.3 0 -.1 4.6 1.1 4.6c1.4 0 3.5 -4.7 3.8 -4.7c.3 0 0 4.7 1.3 4.7c2.9 0 2 6.8 .8 6.8c-1.2 0 1.4 -6.8 4.4 -6.8c1 0 2.9 -4.5 3.4 -4.5c.5 0 .1 4.5 1.1 4.5" />

  <!-- the blocks after the sheet, moved down out of the way -->
  <g class="m-leave" style="--m-at: 0.61">
    <g class="m-move" style="--m-at: 0.565; --m-dx: 0; --m-dy: -22">
      <circle class="m-line-dim" cx="76" cy="156" r="1.6" />
      <rect class="m-line-dim" x="84" y="154.25" width="96" height="3.5" rx="1.75" />
      <circle class="m-line-dim" cx="76" cy="168" r="1.6" />
      <rect class="m-line-dim" x="84" y="166.25" width="70" height="3.5" rx="1.75" />
      <circle class="m-line-dim" cx="76" cy="180" r="1.6" />
      <rect class="m-line-dim" x="84" y="178.25" width="84" height="3.5" rx="1.75" />
    </g>
  </g>

  <!-- the next sheet, on the same ruled paper, its top in view -->
  <g class="m-light" style="--m-at: 0.59">
    <path class="m-card" d="M84 190V132a2 2 0 0 1 2-2h136a2 2 0 0 1 2 2v58" />
    <path class="m-rule" d="M84 148H224M84 166H224M84 184H224" />
  </g>
  <path class="m-link m-light" style="--m-at: 0.62" d="M80.5 189V132a5.5 5.5 0 0 1 5.5-5.5h136a5.5 5.5 0 0 1 5.5 5.5v57" />

  <!-- the hand: along the line, back to the start of the next, along it -->
  <g class="m-move" style="--m-at: 0.435; --m-dx: -31.8; --m-dy: 0">
    <g class="m-move" style="--m-at: 0.355; --m-dx: -31.8; --m-dy: 0">
      <g class="m-move" style="--m-at: 0.23; --m-dx: 103.7; --m-dy: -18">
        <g class="m-move" style="--m-at: 0.115; --m-dx: -51.85; --m-dy: 0">
          <g class="m-move" style="--m-at: 0.035; --m-dx: -51.85; --m-dy: 0">
            <g transform="translate(152.36 77.96) scale(0.62)">
              <path class="m-pointer" d="M2 2 L2 20 L7 15.5 L10.5 23 L14 21.5 L10.5 14 L17 14 Z" />
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
