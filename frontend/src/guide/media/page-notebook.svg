<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- One page, two views: the sheets sit among the notes, or fill the
       viewer. The same sheet lights up on both sides, because it is the
       same block either way (guide/media.js). -->
  <style>
    [data-media="page-notebook"] .frame { fill: var(--bg-card); stroke: var(--border); }
    [data-media="page-notebook"] .well { fill: var(--bg-page); stroke: var(--border-subtle); }
    [data-media="page-notebook"] .note { fill: var(--text-dim); opacity: 0.45; }
    [data-media="page-notebook"] .sheet { fill: var(--bg-surface); stroke: var(--border); }
    [data-media="page-notebook"] .rule { stroke: var(--border-subtle); stroke-width: 1; }
    [data-media="page-notebook"] .ink { stroke: var(--text-secondary); stroke-width: 1.6; fill: none; stroke-linecap: round; }
    [data-media="page-notebook"] .same { stroke: var(--accent); fill: none; stroke-width: 1.6; }
    [data-media="page-notebook"] .link { stroke: var(--accent); stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; opacity: 0.75; }
    [data-media="page-notebook"] .tab { fill: var(--bg-raised); stroke: var(--border); }
    [data-media="page-notebook"] .tabOn { fill: var(--accent-bg); stroke: var(--accent); }
    [data-media="page-notebook"] .pulseA { animation: pnPulse 4.4s ease-in-out infinite; }
    [data-media="page-notebook"] .pulseB { animation: pnPulse 4.4s ease-in-out infinite; animation-delay: 0.35s; }
    [data-media="page-notebook"] .trace { stroke-dasharray: 60; animation: pnTrace 4.4s ease-in-out infinite; }
    @keyframes pnPulse {
      0%, 18% { opacity: 0; }
      36%, 74% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes pnTrace {
      0%, 30% { stroke-dashoffset: 60; }
      52%, 78% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 60; }
    }
  </style>

  <!-- left: the notes view, a sheet standing among the note blocks -->
  <rect class="frame" x="12" y="26" width="132" height="152" rx="9" stroke-width="1" />
  <rect class="tab" x="24" y="36" width="42" height="11" rx="5.5" stroke-width="1" />
  <rect class="note" x="24" y="56" width="92" height="5" rx="2.5" />
  <rect class="note" x="24" y="67" width="72" height="5" rx="2.5" />
  <g>
    <rect class="sheet" x="24" y="82" width="96" height="58" rx="4" stroke-width="1" />
    <path class="rule" d="M30 96h84M30 106h84M30 116h84M30 126h84" />
    <path class="ink" d="M40 124c8-10 14 4 22-5s12 6 20-3" />
    <rect class="same pulseA" x="21.5" y="79.5" width="101" height="63" rx="6" />
  </g>
  <rect class="note" x="24" y="150" width="84" height="5" rx="2.5" />
  <rect class="note" x="24" y="161" width="60" height="5" rx="2.5" />

  <!-- the two views are one page -->
  <path class="link trace" d="M150 102h20" />

  <!-- right: the notebook view, the sheets in the viewer's place -->
  <rect class="frame" x="176" y="26" width="132" height="152" rx="9" stroke-width="1" />
  <rect class="tabOn" x="188" y="36" width="42" height="11" rx="5.5" stroke-width="1" />
  <rect class="well" x="186" y="54" width="90" height="114" rx="5" stroke-width="1" />
  <g>
    <rect class="sheet" x="194" y="60" width="74" height="48" rx="4" stroke-width="1" />
    <path class="rule" d="M200 72h62M200 81h62M200 90h62M200 99h62" />
    <path class="ink" d="M206 97c6-8 11 3 17-4s9 5 15-2" />
    <rect class="same pulseB" x="191.5" y="57.5" width="79" height="53" rx="6" />
  </g>
  <rect class="sheet" x="194" y="114" width="74" height="48" rx="4" stroke-width="1" />
  <path class="rule" d="M200 126h62M200 135h62M200 144h62M200 153h62" />

  <!-- the notes stay beside them, one row per sheet -->
  <rect class="note" x="284" y="62" width="16" height="5" rx="2.5" />
  <rect class="note" x="284" y="73" width="12" height="5" rx="2.5" />
  <rect class="note" x="284" y="116" width="16" height="5" rx="2.5" />
  <rect class="note" x="284" y="127" width="10" height="5" rx="2.5" />
</svg>
