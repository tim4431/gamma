<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- Move a note by its handle: the pointer rests on the third note, and
       its ⋮⋮ handle shows. The pointer takes the handle and carries it (the
       drag image is the handle itself) up a row: the drop line shows under
       the first note, starting at its left edge. Carried on to the right, the
       line steps in by one indent, so the note will nest. On the drop the
       rows glide: the carried note lands under the first, indented, with
       its parent's thread line beside it, and the note it passed moves down
       into the place it left (BlockTree's row and .blockChildren; App's
       onBlockDragOver; BlockDropIndicator, one indent per depth). -->

  <!-- the Notes window: its title row and the page's heading -->
  <rect class="m-card" x="12" y="12" width="296" height="176" rx="6" />
  <path class="m-glyph" d="M19 18h.01M22 18h.01M19 21h.01M22 21h.01M19 24h.01M22 24h.01" />
  <rect class="m-line" x="28" y="19" width="26" height="4" rx="2" />
  <path class="m-rule" d="M12 30H308" />
  <rect class="m-line" x="28" y="42" width="110" height="6" rx="3" />

  <!-- the notes that stay: the first and the last -->
  <rect class="m-line-dim" x="48" y="64" width="180" height="4" rx="2" />
  <rect class="m-line-dim" x="48" y="136" width="200" height="4" rx="2" />

  <!-- the second note, which moves down into the place left -->
  <g class="m-move" style="--m-at: 0.5; --m-dx: 0; --m-dy: -24">
    <rect class="m-line-dim" x="48" y="112" width="150" height="4" rx="2" />
  </g>

  <!-- the carried note, landing nested under the first, and its thread -->
  <path class="m-rule m-light" style="--m-at: 0.56" d="M40 72V94" />
  <g class="m-move" style="--m-at: 0.5; --m-dx: -16; --m-dy: 24">
    <rect class="m-line-dim" x="64" y="88" width="140" height="4" rx="2" />
  </g>

  <!-- its handle, shown while the pointer is on the row -->
  <g class="m-leave" style="--m-at: 0.48">
    <g class="m-light" style="--m-at: 0.1">
      <rect class="m-chip" x="24" y="106" width="14" height="16" rx="4" />
      <path class="m-glyph" d="M29.6 111h.01M32.4 111h.01M29.6 114h.01M32.4 114h.01M29.6 117h.01M32.4 117h.01" />
    </g>
  </g>

  <!-- the drop line: from the row's left edge, then one indent in -->
  <g class="m-leave" style="--m-at: 0.48">
    <g class="m-light" style="--m-at: 0.24">
      <path class="m-link m-leave" style="--m-at: 0.32" d="M40 100H56" />
      <path class="m-link" d="M56 100H290" />
    </g>
  </g>

  <!-- the hand carrying the handle: in, up a row, a step right -->
  <circle class="m-ripple m-press" style="--m-at: 0.14" cx="31" cy="114" r="8" />
  <g class="m-move" style="--m-at: 0.3; --m-dx: -16; --m-dy: 0">
    <g class="m-move" style="--m-at: 0.18; --m-dx: -5; --m-dy: 16">
      <g class="m-move" style="--m-at: 0.02; --m-dx: 169; --m-dy: 56">
        <g class="m-leave" style="--m-at: 0.48">
          <g class="m-light" style="--m-at: 0.16">
            <rect class="m-ghost" x="45" y="90" width="14" height="16" rx="4" />
            <path class="m-glyph-on" d="M50.6 95h.01M53.4 95h.01M50.6 98h.01M53.4 98h.01M50.6 101h.01M53.4 101h.01" />
          </g>
        </g>
        <g transform="translate(50.76 96.76) scale(0.62)">
          <path class="m-pointer" d="M2 2 L2 20 L7 15.5 L10.5 23 L14 21.5 L10.5 14 L17 14 Z" />
        </g>
      </g>
    </g>
  </g>
</svg>
