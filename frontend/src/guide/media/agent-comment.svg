<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- An agent on this computer answers a comment: a passage of the page
       (the PDF a synced folder builds) is commented in the margin, level
       with it and linked to it. A line is typed into the field, the
       pointer ticks Send to Codex under it and presses send in the box.
       The thread's tag says the agent is working; the passage is rewritten
       in place, the page built again, and the agent's answer comes into
       the thread under its own avatar, a rounded square with the computer
       it ran on beside its name (docs/dev/local_agents.md, "A comment sent
       to an agent"; README, "Work with an agent on your computer"). -->

  <!-- the viewer: the page, room in the margin to its right -->
  <rect class="m-well" x="10" y="10" width="300" height="180" rx="6" />
  <rect class="m-card" x="20" y="18" width="172" height="172" rx="2" />
  <rect class="m-line" x="30" y="30" width="64" height="6" rx="3" />
  <rect class="m-line-dim" x="30" y="44" width="150" height="3.5" rx="1.75" />
  <rect class="m-line-dim" x="30" y="51" width="144" height="3.5" rx="1.75" />
  <rect class="m-line-dim" x="30" y="58" width="150" height="3.5" rx="1.75" />
  <rect class="m-line-dim" x="30" y="79" width="150" height="3.5" rx="1.75" />
  <rect class="m-line-dim" x="30" y="86" width="136" height="3.5" rx="1.75" />
  <rect class="m-line-dim" x="30" y="93" width="150" height="3.5" rx="1.75" />
  <rect class="m-line-dim" x="30" y="100" width="112" height="3.5" rx="1.75" />
  <rect class="m-well" x="30" y="112" width="150" height="40" rx="2" />
  <path class="m-glyph" d="M38 144L54 132L66 138L82 124L102 131" />
  <rect class="m-line-dim" x="30" y="162" width="150" height="3.5" rx="1.75" />
  <rect class="m-line-dim" x="30" y="169" width="130" height="3.5" rx="1.75" />
  <rect class="m-line-dim" x="30" y="176" width="150" height="3.5" rx="1.75" />

  <!-- the commented passage, as it was -->
  <g class="m-leave" style="--m-at: 0.6">
    <path class="m-mark" d="M30 66.75H180" />
    <path class="m-mark" d="M30 73.75H130" />
    <rect class="m-line-dim" x="30" y="65" width="150" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="30" y="72" width="100" height="3.5" rx="1.75" />
  </g>
  <!-- and as the agent rewrote it, the page built again -->
  <g class="m-light" style="--m-at: 0.62">
    <path class="m-mark" d="M30 66.75H176" />
    <path class="m-mark" d="M30 73.75H160" />
    <rect class="m-line" x="30" y="65" width="146" height="3.5" rx="1.75" />
    <rect class="m-line" x="30" y="72" width="130" height="3.5" rx="1.75" />
  </g>

  <!-- the thread, in the margin level with the passage -->
  <path class="m-link m-draw" pathLength="1" style="--m-at: 0.02" d="M181 68H199" />
  <g class="m-appear" style="--m-at: 0.02">
    <rect class="m-card" x="200" y="48" width="104" height="96" rx="6" />
    <circle class="m-chip-on" cx="210" cy="59" r="5" />
    <rect class="m-line" x="219" y="57" width="36" height="4" rx="2" />
    <rect class="m-chip" x="206" y="69" width="92" height="16" rx="4" />
    <circle class="m-chip-on" cx="291" cy="77" r="4.5" />
    <path class="m-glyph-on" d="M291 79.5V74.5M288.8 76.6L291 74.4L293.2 76.6" />
    <rect class="m-chip" x="206" y="90" width="8" height="8" rx="2" />
    <rect class="m-line-dim" x="218" y="92.5" width="44" height="3" rx="1.5" />
  </g>
  <path class="m-text m-draw" pathLength="1" style="--m-at: 0.1" d="M212 77H262" />

  <!-- Send to Codex, ticked -->
  <g class="m-light" style="--m-at: 0.43">
    <rect class="m-chip-on" x="206" y="90" width="8" height="8" rx="2" />
    <path class="m-glyph-on" d="M207.8 94.2L209.6 96L212.4 92.4" />
  </g>

  <!-- the thread's tag while the agent works, giving way to its answer -->
  <g class="m-leave" style="--m-at: 0.68">
    <g class="m-appear" style="--m-at: 0.57">
      <rect class="m-chip" x="206" y="104" width="54" height="10" rx="5" />
      <path class="m-glyph-on" d="M213.5 106.5a2.5 2.5 0 1 1-2.5 2.5" />
      <rect class="m-line-dim" x="218" y="107.5" width="34" height="3" rx="1.5" />
    </g>
  </g>

  <!-- the agent's answer, under its own avatar and the computer it ran on -->
  <g class="m-appear" style="--m-at: 0.7">
    <rect class="m-chip-on" x="205" y="104" width="10" height="10" rx="3" />
    <path class="m-glyph-on" d="M210 104V102.6" />
    <circle class="m-glyph-on" cx="210" cy="102" r="0.6" />
    <circle class="m-glyph-on" cx="208.2" cy="109" r="0.6" />
    <circle class="m-glyph-on" cx="211.8" cy="109" r="0.6" />
    <rect class="m-line" x="219" y="106" width="30" height="4" rx="2" />
    <path class="m-glyph" d="M253.5 104.5H261.5V109.5H253.5ZM252 111.5H263" />
    <rect class="m-line-dim" x="206" y="119" width="92" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="206" y="126" width="84" height="3.5" rx="1.75" />
    <rect class="m-line-dim" x="206" y="133" width="58" height="3.5" rx="1.75" />
  </g>

  <!-- the presses: the tick, then send -->
  <circle class="m-ripple m-press" style="--m-at: 0.41" cx="210" cy="94" r="7" />
  <circle class="m-ripple m-press" style="--m-at: 0.55" cx="291" cy="77" r="7" />

  <!-- the hand: into the field, down to the tick, across to send -->
  <g class="m-move" style="--m-at: 0.44; --m-dx: -81; --m-dy: 17">
  <g class="m-move" style="--m-at: 0.3; --m-dx: 4; --m-dy: -12">
  <g class="m-move" style="--m-at: 0.0; --m-dx: 36; --m-dy: 68">
    <g transform="translate(289.76 75.76) scale(0.62)"><path class="m-pointer" d="M2 2 L2 20 L7 15.5 L10.5 23 L14 21.5 L10.5 14 L17 14 Z" /></g>
  </g></g></g>
</svg>
