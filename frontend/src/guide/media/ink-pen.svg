<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- Write on the page: the pointer clicks the pen in the viewer's tool
       column, which lights, and the markup strip opens at the top of the
       page with its first pen armed. The pointer goes to the page and the
       pen takes over: a phrase is circled and, in a second stroke, an arrow
       is drawn out into the margin, which the paragraphs leave free. The
       strokes are one drawing, and that drawing is a note: a block appears
       in Notes, its pen marker and the strokes as a picture on a piece of
       the page (App's viewer strip, markup/MarkupToolbar.jsx, InkCard in
       ink/InkLayer.jsx). -->

  <!-- the viewer: the page, with room in its right margin -->
  <rect class="m-well" x="12" y="12" width="200" height="176" rx="6" />
  <rect class="m-card" x="48" y="20" width="156" height="160" rx="2" />
  <rect class="m-line" x="60" y="50" width="64" height="5" rx="2.5" />
  <rect class="m-line-dim" x="60" y="62" width="116" height="3" rx="1.5" />
  <rect class="m-line-dim" x="60" y="69" width="110" height="3" rx="1.5" />
  <rect class="m-line-dim" x="60" y="76" width="116" height="3" rx="1.5" />
  <rect class="m-line-dim" x="60" y="83" width="116" height="3" rx="1.5" />
  <rect class="m-line-dim" x="60" y="90" width="70" height="3" rx="1.5" />
  <rect class="m-well" x="60" y="102" width="44" height="30" rx="2" />
  <path class="m-glyph" d="M65 126L73 117L81 121L89 110L98 114" />
  <rect class="m-line-dim" x="110" y="104" width="66" height="3" rx="1.5" />
  <rect class="m-line-dim" x="110" y="111" width="60" height="3" rx="1.5" />
  <rect class="m-line-dim" x="110" y="118" width="66" height="3" rx="1.5" />
  <rect class="m-line-dim" x="110" y="125" width="40" height="3" rx="1.5" />
  <rect class="m-line-dim" x="60" y="142" width="116" height="3" rx="1.5" />
  <rect class="m-line-dim" x="60" y="149" width="110" height="3" rx="1.5" />
  <rect class="m-line-dim" x="60" y="156" width="116" height="3" rx="1.5" />
  <rect class="m-line-dim" x="60" y="163" width="104" height="3" rx="1.5" />
  <rect class="m-line-dim" x="60" y="170" width="72" height="3" rx="1.5" />

  <!-- the tool column: search, zoom, fit width, pen, record -->
  <rect class="m-card" x="20" y="62" width="20" height="76" rx="5" />
  <circle class="m-glyph" cx="29" cy="71" r="2.8" />
  <path class="m-glyph" d="M31 73L33.2 75.2" />
  <circle class="m-glyph" cx="29" cy="85" r="2.8" />
  <path class="m-glyph" d="M31 87L33.2 89.2M29 83.6V86.4M27.6 85H30.4" />
  <path class="m-glyph" d="M26 96.5V103.5M34 96.5V103.5M28 100H32" />
  <path class="m-glyph" d="M33.4 110.6a1.4 1.4 0 0 0-2-2L26 114l-0.8 2.8 2.8-0.8z" />
  <rect class="m-glyph" x="28.2" y="123" width="3.6" height="6" rx="1.8" />
  <path class="m-glyph" d="M26.6 127a3.4 3.4 0 0 0 6.8 0M30 130.4V132" />
  <g class="m-light" style="--m-at: 0.13">
    <rect class="m-chip-on" x="22.5" y="106" width="15" height="15" rx="3.5" />
    <path class="m-glyph-on" d="M33.4 110.6a1.4 1.4 0 0 0-2-2L26 114l-0.8 2.8 2.8-0.8z" />
  </g>

  <!-- the markup strip: three pens (the first armed), a rule, colours -->
  <g class="m-appear" style="--m-at: 0.15">
    <rect class="m-card" x="78" y="26" width="96" height="16" rx="4" />
    <rect class="m-chip" x="82" y="29" width="11" height="10" rx="3" />
    <path class="m-glyph-on" d="M90.5 31L85.5 36.5" />
    <path class="m-glyph" d="M100.5 31L95.5 36.5M110.5 31L105.5 36.5" />
    <path class="m-rule" d="M116 30V38" />
    <circle class="m-chip-on" cx="124" cy="34" r="2.2" />
    <circle class="m-line-dim" cx="133" cy="34" r="2.2" />
    <circle class="m-line-dim" cx="142" cy="34" r="2.2" />
    <circle class="m-line-dim" cx="151" cy="34" r="2.2" />
    <circle class="m-line-dim" cx="160" cy="34" r="2.2" />
  </g>

  <!-- the ink: a phrase circled, then an arrow into the margin -->
  <path class="m-ink m-draw" pathLength="1" style="--m-at: 0.32" d="M160 64C170 69 156 79 132 79C108 79 98 74 100 68C102 62 118 61 134 61C152 61 166 65 162 72" />
  <path class="m-ink m-draw m-quick" pathLength="1" style="--m-at: 0.52" d="M162 72C168 84 176 92 190 96M190 96L183 92M190 96L184 101" />

  <!-- Notes: the drawing's block, the strokes on a piece of the page -->
  <rect class="m-card" x="220" y="12" width="88" height="176" rx="6" />
  <path class="m-glyph" d="M227 18h.01M230 18h.01M227 21h.01M230 21h.01M227 24h.01M230 24h.01" />
  <rect class="m-line" x="236" y="19" width="26" height="4" rx="2" />
  <path class="m-rule" d="M220 30H308" />
  <rect class="m-line-dim" x="236" y="40.5" width="62" height="3" rx="1.5" />
  <rect class="m-line-dim" x="236" y="52.5" width="48" height="3" rx="1.5" />
  <g class="m-appear" style="--m-at: 0.62">
    <rect class="m-chip" x="226" y="62" width="9" height="9" rx="2.5" />
    <path class="m-glyph" d="M232.5 64.5L228.5 68.5" />
    <rect class="m-line-dim" x="240" y="65" width="30" height="3" rx="1.5" />
    <rect class="m-card" x="226" y="76" width="76" height="44" rx="3" />
    <g transform="translate(168.3 43) scale(0.65)">
      <path class="m-ink" d="M160 64C170 69 156 79 132 79C108 79 98 74 100 68C102 62 118 61 134 61C152 61 166 65 162 72" />
      <path class="m-ink" d="M162 72C168 84 176 92 190 96M190 96L183 92M190 96L184 101" />
    </g>
  </g>

  <!-- the hand: to the pen, then to where the ink starts, where it hands over -->
  <circle class="m-ripple m-press" style="--m-at: 0.13" cx="30" cy="113" r="7" />
  <g class="m-leave" style="--m-at: 0.31">
    <g class="m-move" style="--m-at: 0.18; --m-dx: -130; --m-dy: 49">
      <g class="m-move" style="--m-at: 0.02; --m-dx: 100; --m-dy: 57">
        <g transform="translate(158.76 62.76) scale(0.62)">
          <path class="m-pointer" d="M2 2 L2 20 L7 15.5 L10.5 23 L14 21.5 L10.5 14 L17 14 Z" />
        </g>
      </g>
    </g>
  </g>
</svg>
