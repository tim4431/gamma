<svg viewBox="0 0 320 178" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- The window that started the work closes; the job goes on on the
       server, and the tray keeps its progress (guide/media.js,
       docs/dev/tasks.md). -->
  <style>
    [data-media="tasks-keep-going"] .win { fill: var(--bg-card); stroke: var(--border); }
    [data-media="tasks-keep-going"] .bar { fill: var(--bg-raised); stroke: var(--border-subtle); }
    [data-media="tasks-keep-going"] .fill { fill: var(--accent); }
    [data-media="tasks-keep-going"] .line { fill: var(--text-dim); opacity: 0.45; }
    [data-media="tasks-keep-going"] .server { fill: var(--bg-raised); stroke: var(--border); }
    [data-media="tasks-keep-going"] .tray { fill: var(--bg-card); stroke: var(--border); }
    [data-media="tasks-keep-going"] .glyph { stroke: var(--text-muted); fill: none; stroke-width: 1.6; stroke-linecap: round; }
    [data-media="tasks-keep-going"] .arc { stroke: var(--accent); fill: none; stroke-width: 2.2; stroke-linecap: round; }
    [data-media="tasks-keep-going"] .closing { animation: tkClose 5s ease-in-out infinite; transform-origin: 84px 54px; }
    [data-media="tasks-keep-going"] .keepsGoing { animation: tkFill 5s linear infinite; }
    [data-media="tasks-keep-going"] .spin { animation: tkSpin 1.1s linear infinite; transform-origin: 268px 118px; }
    [data-media="tasks-keep-going"] .hop { animation: tkHop 5s ease-in-out infinite; }
    @keyframes tkClose {
      0%, 30% { opacity: 1; transform: scale(1); }
      52%, 88% { opacity: 0; transform: scale(0.94); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes tkFill {
      0% { width: 6px; }
      100% { width: 128px; }
    }
    @keyframes tkSpin { to { transform: rotate(360deg); } }
    @keyframes tkHop {
      0%, 34% { opacity: 0; }
      54%, 88% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <!-- the window the work was started from -->
  <g class="closing">
    <rect class="win" x="18" y="14" width="132" height="80" rx="8" stroke-width="1" />
    <path class="glyph" d="M30 27h.01M37 27h.01M44 27h.01" stroke-width="2.6" />
    <rect class="line" x="30" y="42" width="72" height="5" rx="2.5" />
    <rect class="bar" x="30" y="58" width="108" height="9" rx="4.5" stroke-width="1" />
    <rect class="fill" x="30" y="58" width="52" height="9" rx="4.5" />
    <rect class="line" x="30" y="76" width="46" height="4" rx="2" />
  </g>

  <!-- the job itself, on the server, not in the window -->
  <path class="glyph hop" d="M84 100v14m-4-4 4 4 4-4" />
  <rect class="server" x="18" y="120" width="146" height="42" rx="8" stroke-width="1" />
  <rect class="bar" x="30" y="130" width="122" height="9" rx="4.5" stroke-width="1" />
  <rect class="fill keepsGoing" x="30" y="130" width="6" height="9" rx="4.5" />
  <rect class="line" x="30" y="148" width="60" height="4" rx="2" />

  <!-- the tray button, spinning while anything runs -->
  <rect class="tray" x="246" y="96" width="44" height="44" rx="10" stroke-width="1" />
  <circle cx="268" cy="118" r="9" stroke="var(--border)" fill="none" stroke-width="2.2" />
  <path class="arc spin" d="M268 109a9 9 0 0 1 9 9" />
  <rect class="line" x="240" y="152" width="56" height="4" rx="2" />
</svg>
