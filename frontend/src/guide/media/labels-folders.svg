<svg viewBox="0 0 310 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- One paper, never copied, filed in several folders at once, with its
       labels beside it. Folders and labels are drawn as the same chip with a
       different glyph, because a folder is a label whose value is a path
       (guide/media.js, docs/dev/home_library.md). -->
  <style>
    [data-media="labels-folders"] .card { fill: var(--bg-card); stroke: var(--border); }
    [data-media="labels-folders"] .cardLine { fill: var(--text-dim); opacity: 0.5; }
    [data-media="labels-folders"] .chip { fill: var(--bg-raised); stroke: var(--border); }
    [data-media="labels-folders"] .chipOn { fill: var(--accent-bg); stroke: var(--accent); }
    [data-media="labels-folders"] .chipLine { fill: var(--text-muted); opacity: 0.7; }
    [data-media="labels-folders"] .glyph { stroke: var(--text-secondary); fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    [data-media="labels-folders"] .glyphOn { stroke: var(--accent); fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    [data-media="labels-folders"] .tie { stroke: var(--accent); stroke-width: 1.6; fill: none; stroke-linecap: round; }
    [data-media="labels-folders"] .grow { stroke-dasharray: 108; animation: lfGrow 5s ease-in-out infinite; }
    [data-media="labels-folders"] .joinChip { animation: lfJoin 5s ease-in-out infinite; }
    [data-media="labels-folders"] .beat { animation: lfBeat 5s ease-in-out infinite; transform-origin: 155px 60px; }
    @keyframes lfGrow {
      0%, 34% { stroke-dashoffset: 108; opacity: 0; }
      42% { opacity: 1; }
      60%, 88% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 108; opacity: 0; }
    }
    @keyframes lfJoin {
      0%, 46% { opacity: 0.35; }
      64%, 88% { opacity: 1; }
      100% { opacity: 0.35; }
    }
    @keyframes lfBeat {
      0%, 30%, 100% { transform: none; }
      48% { transform: scale(1.03); }
      66% { transform: none; }
    }
  </style>

  <!-- the paper: one block, wherever it is filed -->
  <g class="beat">
    <rect class="card" x="112" y="20" width="86" height="80" rx="8" stroke-width="1" />
    <rect class="cardLine" x="124" y="34" width="58" height="6" rx="3" />
    <rect class="cardLine" x="124" y="48" width="44" height="4" rx="2" />
    <rect class="cardLine" x="124" y="58" width="60" height="4" rx="2" />
    <rect class="cardLine" x="124" y="68" width="38" height="4" rx="2" />
    <rect class="cardLine" x="124" y="78" width="52" height="4" rx="2" />
  </g>

  <!-- its labels: an author, an acronym — a chip with a tag glyph -->
  <g>
    <rect class="chip" x="216" y="28" width="78" height="18" rx="9" stroke-width="1" />
    <path class="glyph" d="M226 33.5l5-1.5 5 5-4.5 4.5-5-5z" />
    <circle cx="229.5" cy="35.5" r="0.9" fill="currentColor" stroke="none" />
    <rect class="chipLine" x="242" y="35" width="42" height="4" rx="2" />
  </g>
  <g>
    <rect class="chip" x="216" y="54" width="78" height="18" rx="9" stroke-width="1" />
    <path class="glyph" d="M226 59.5l5-1.5 5 5-4.5 4.5-5-5z" />
    <circle cx="229.5" cy="61.5" r="0.9" fill="currentColor" stroke="none" />
    <rect class="chipLine" x="242" y="61" width="30" height="4" rx="2" />
  </g>

  <!-- the folders it is filed in: the same chip, a folder glyph -->
  <path class="tie" d="M148 102C148 130 70 128 62 152" />
  <path class="tie" d="M155 102v50" />
  <path class="tie grow" d="M162 102C162 130 240 128 248 152" />

  <g>
    <rect class="chip" x="20" y="154" width="84" height="22" rx="11" stroke-width="1" />
    <path class="glyph" d="M32 161.5h6l2 2.5h7v9H32z" />
    <rect class="chipLine" x="52" y="163" width="42" height="4" rx="2" />
  </g>
  <g>
    <rect class="chip" x="113" y="154" width="84" height="22" rx="11" stroke-width="1" />
    <path class="glyph" d="M125 161.5h6l2 2.5h7v9h-15z" />
    <rect class="chipLine" x="145" y="163" width="36" height="4" rx="2" />
  </g>
  <g class="joinChip">
    <rect class="chipOn" x="206" y="154" width="84" height="22" rx="11" stroke-width="1" />
    <path class="glyphOn" d="M218 161.5h6l2 2.5h7v9h-15z" />
    <rect class="chipLine" x="238" y="163" width="40" height="4" rx="2" />
  </g>
</svg>
