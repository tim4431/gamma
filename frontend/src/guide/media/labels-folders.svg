<svg viewBox="0 0 310 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- One paper, never copied: it carries its labels, and it is filed in
       three folders at once. The accent is the filing: the three links and
       the folders they reach (guide/media.js, docs/dev/home_library.md). -->

  <!-- the paper, with its labels -->
  <rect class="m-card" x="89" y="22" width="132" height="88" rx="8" />
  <rect class="m-line" x="103" y="35" width="70" height="7" rx="3.5" />
  <rect class="m-line-dim" x="103" y="50" width="104" height="4" rx="2" />
  <rect class="m-line-dim" x="103" y="59" width="82" height="4" rx="2" />
  <g class="m-appear" style="--m-at: 0.02">
    <rect class="m-chip" x="103" y="76" width="54" height="18" rx="9" />
    <path class="m-glyph" d="M110 81h3.5l4.5 4.5-3.5 3.5-4.5-4.5zM112.2 83.2h.01" />
    <rect class="m-line" x="123" y="83" width="24" height="4" rx="2" />
  </g>
  <g class="m-appear" style="--m-at: 0.1">
    <rect class="m-chip" x="163" y="76" width="46" height="18" rx="9" />
    <path class="m-glyph" d="M170 81h3.5l4.5 4.5-3.5 3.5-4.5-4.5zM172.2 83.2h.01" />
    <rect class="m-line" x="183" y="83" width="16" height="4" rx="2" />
  </g>

  <!-- filed: one link to each folder -->
  <path class="m-link m-draw" pathLength="1" style="--m-at: 0.24" d="M137 110C137 132 62 128 62 150" />
  <path class="m-link m-draw" pathLength="1" style="--m-at: 0.28" d="M155 110V150" />
  <path class="m-link m-draw" pathLength="1" style="--m-at: 0.32" d="M173 110C173 132 248 128 248 150" />

  <!-- the folders, each lit as the paper reaches it -->
  <rect class="m-chip" x="20" y="150" width="84" height="24" rx="12" />
  <path class="m-glyph" d="M33 158.3a1.5 1.5 0 0 1 1.5-1.5h3.2l1.6 1.8h5.2a1.5 1.5 0 0 1 1.5 1.5v5.7a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5z" />
  <g class="m-light" style="--m-at: 0.38">
    <rect class="m-chip-on" x="20" y="150" width="84" height="24" rx="12" />
    <path class="m-glyph-on" d="M33 158.3a1.5 1.5 0 0 1 1.5-1.5h3.2l1.6 1.8h5.2a1.5 1.5 0 0 1 1.5 1.5v5.7a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5z" />
  </g>
  <rect class="m-line-dim" x="53" y="160" width="38" height="4" rx="2" />

  <rect class="m-chip" x="113" y="150" width="84" height="24" rx="12" />
  <path class="m-glyph" d="M126 158.3a1.5 1.5 0 0 1 1.5-1.5h3.2l1.6 1.8h5.2a1.5 1.5 0 0 1 1.5 1.5v5.7a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5z" />
  <g class="m-light" style="--m-at: 0.42">
    <rect class="m-chip-on" x="113" y="150" width="84" height="24" rx="12" />
    <path class="m-glyph-on" d="M126 158.3a1.5 1.5 0 0 1 1.5-1.5h3.2l1.6 1.8h5.2a1.5 1.5 0 0 1 1.5 1.5v5.7a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5z" />
  </g>
  <rect class="m-line-dim" x="146" y="160" width="30" height="4" rx="2" />

  <rect class="m-chip" x="206" y="150" width="84" height="24" rx="12" />
  <path class="m-glyph" d="M219 158.3a1.5 1.5 0 0 1 1.5-1.5h3.2l1.6 1.8h5.2a1.5 1.5 0 0 1 1.5 1.5v5.7a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5z" />
  <g class="m-light" style="--m-at: 0.46">
    <rect class="m-chip-on" x="206" y="150" width="84" height="24" rx="12" />
    <path class="m-glyph-on" d="M219 158.3a1.5 1.5 0 0 1 1.5-1.5h3.2l1.6 1.8h5.2a1.5 1.5 0 0 1 1.5 1.5v5.7a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5z" />
  </g>
  <rect class="m-line-dim" x="239" y="160" width="42" height="4" rx="2" />
</svg>
