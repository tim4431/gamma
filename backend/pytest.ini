[pytest]
testpaths = tests
# A test that never ends (a socket read whose message was lost, a lock no
# one releases) would otherwise hold a CI job until its 6-hour limit. After
# this long the worker prints every thread's stack and exits; xdist reports
# the test as crashed and runs the rest on a fresh worker.
timeout = 300
timeout_method = thread
# The timing budgets (tests/test_perf.py) run only when asked for, alone:
# `-m perf` on the command line takes the place of this one.
markers =
    perf: timing budgets (tests/test_perf.py), run alone with -m perf, never with -n
addopts = -m "not perf"
