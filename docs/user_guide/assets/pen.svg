  <title id="title">Draw on the page with the pen</title>
  <desc id="desc">The pen is picked from the tool strip beside the paper. A phrase is circled and an arrow drawn from it to a figure; both strokes appear in the notes as one ink block. Then the lasso is picked, a dashed loop is drawn around the arrow, and red is chosen: the arrow turns red, on the page and in the notes.</desc>
