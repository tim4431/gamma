  <title id="title">Offline copies keep in step by themselves</title>
  <desc id="desc">A laptop holding an offline copy, the lab server and a phone, joined by sync lines. A note typed on the laptop travels to the server and on to the phone while the sync pill spins, then turns green. The laptop goes offline; a second note waits with a dot on the pill, and goes out as soon as the line is back.</desc>
