  <title id="title">File a paper in a folder, label it, filter by the label</title>
  <desc id="desc">A paper card is dragged onto the Quantum folder, whose count goes from 2 to 3. Then the label to-read is typed into another card's label row and becomes a chip; clicking the chip filters the library, and the cards without that label dim.</desc>
