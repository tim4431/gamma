<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">A notebook sheet among the notes</title>
  <desc id="desc">/note is typed in an empty note block, and the block becomes a sheet of ruled paper. A pen writes two lines on it; writing near the bottom of the sheet brings a second sheet in below, so there is always paper below.</desc>
