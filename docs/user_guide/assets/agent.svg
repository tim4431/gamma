  <title id="title">The assistant asks before changing anything</title>
  <desc id="desc">A folder of four papers. In its chat “rename these AuthorYear” is typed and sent. The reply shows a card with one rename, the old title struck through and the new one highlighted, and the answers Allow once, Allow in this chat and Don’t allow. Allow in this chat is clicked; the four titles change to Lukin 2024, Bloch 2023, Saffman 2022 and Browaeys 2021, and a line says “Changed in your library · 4” with Revert all.</desc>
