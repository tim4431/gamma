<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Metadata, and the BibTeX entry in the share popover</title>
  <desc id="desc">A paper is open beside its notes. The (i) button in the Notes title row opens the metadata: title, authors, year and DOI fill in one after another. Then the link button in the top bar opens the share popover, whose BibTeX entry is copied with its Copy button, which then reads Copied.</desc>
