    </filter>
    <filter id="lift" x="-60%" y="-40%" width="220%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1400" height="620" fill="#f6f4ef"/>
