<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Translate a paper in place</title>
  <desc id="desc">The 文A button in the zoom column beside the paper is clicked. The title and each paragraph are redrawn one after another in the reader’s language, “Rydberg atoms” becoming “里德堡原子”, while the figure stays put. Holding Alt shows the original for a moment.</desc>
