<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Edit together in a shared workspace</title>
  <desc id="desc">A Notes window in the shared workspace "Lab library", with three members at the top right. You click under a highlighted passage and type a note; at the same time Maya, with a blue caret and name tag, types into the next note, and Sam's green cursor moves along the passage as he reads.</desc>
