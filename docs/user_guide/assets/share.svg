  <title id="title">Share a page with a link</title>
  <desc id="desc">The link button in the top bar is clicked and Share makes the link. The popover then shows the link with Copy link, General access set to Anyone with the link with a View / Edit toggle, and Who has access: Maya, Edit. The toggle is flipped to Edit, and Maya's blue cursor appears typing in the notes.</desc>
