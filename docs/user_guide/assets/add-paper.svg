<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Add a paper from a link, or drop PDFs into the window</title>
  <desc id="desc">The + button in the top bar is clicked and an arXiv link is pasted into its field; on Enter the paper appears in the library and opens beside its notes. Then two PDF files are dragged into the window and become two more papers.</desc>
