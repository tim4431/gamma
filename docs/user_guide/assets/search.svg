  <title id="title">Search notes, highlights and every PDF at once</title>
  <desc id="desc">Ctrl+F opens the search and 3000 qubit is typed; results appear grouped as Titles, Notes on this page and Library PDFs, each with its match marked. A folder chip qc/ narrows them and the row from another folder dims. One hit is clicked and the paper opens with the match highlighted.</desc>
