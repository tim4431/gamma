<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Record audio while you take notes</title>
  <desc id="desc">The microphone after the pen in the zoom column beside the paper is clicked, and a recording pill with a red dot, a counting timer and a level bar appears at the bottom of the page. While it records, a word is handwritten on the page and a note is typed. Stop on the pill turns the recording into a row in the notes. Its play button opens a player bar: the handwriting and the note are faded, and each comes back as the playhead reaches the moment it was written. A tap on the handwritten word jumps the playhead back to just before it.</desc>
