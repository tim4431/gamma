<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Import and export from the View menu</title>
  <desc id="desc">On a page, the View menu opens and Export… is chosen. The dialog lists Annotated PDF, Notes as PDF, Markdown, BibTeX and Obsidian vault, with switches for highlights, notes and bundle files; Annotated PDF is picked and a PDF file flies out. Then Import… is chosen and arrows arrive from Zotero, Obsidian, Notion and PDF annotations.</desc>
