  <title id="title">Notes are a nested outline</title>
  <desc id="desc">Three one-line notes. Shift+Enter starts a new note under the first and a line is typed; Tab indents it under the note above. Then the ⋮⋮ handle of the last note is dragged up, and it moves above the first while the others slide down.</desc>
