  <title id="title">Ask the AI about the paper</title>
  <desc id="desc">Ctrl+drag draws a dashed rectangle over a figure in the paper, and the region lands as a thumbnail over the chat’s message box. “What does the 3 µs plateau mean?” is typed and sent; the answer streams in with a citation “p. 4”, and clicking it highlights the cited line on the page.</desc>
