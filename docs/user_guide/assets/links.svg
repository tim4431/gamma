<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Follow a citation and come back</title>
  <desc id="desc">A citation marker [12] in a paper is clicked; a popover offers Fetch into Gamma and Open in browser. Fetch is clicked and the cited paper opens over the first in a new tab. Then Back in the top bar is clicked and the first paper returns at the same spot.</desc>
