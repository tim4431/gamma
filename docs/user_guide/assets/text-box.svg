  <title id="title">Type on the page with the Text tool</title>
  <desc id="desc">T is picked from the tool strip, a click on the page places a text box, and a sentence is typed into it. The box appears in the notes as a block with a T marker. Clicked, the box shows a thin edge and a handle on its right edge, which is dragged to widen it.</desc>
