<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="theme.css" />
<style>
  /* The page is transparent: only the strip and the open menu paint. While
     the menu is open the view is enlarged over the content; pressing the
     see-through area closes it. */
  html, body { background: transparent; height: 100%; overflow: hidden; }
  .bar {
    position: relative;
    height: 38px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    background: var(--bg-page); /* chrome, like Gamma's own topbar under it */
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
    /* Windows/Linux: the window's own controls are drawn over the bar:
       Windows' three 46 px buttons at its right end, on Linux the buttons
       of the desktop's title-bar layout, at whichever ends main.js reads it
       gives them (body[data-wco], lib/windowControls: only a close button
       on the right on GNOME, on the left or both ends on some desktops and
       in a right-to-left UI). The titlebar-area env() values reach only a
       window's own page, never a view like this one, so those ends are
       kept free here, 146 px each. */
    padding-right: 146px;
  }
  body[data-platform="darwin"] .bar { padding-left: 80px; padding-right: 8px; }
  body[data-wco="left"] .bar { padding-left: 146px; padding-right: 8px; }
  body[data-wco="both"] .bar { padding-left: 146px; }
  body[data-wco="none"] .bar { padding-right: 8px; }
  .bar > * { -webkit-app-region: no-drag; }
  .bar .drag { -webkit-app-region: drag; flex: 1; height: 100%; }
  /* The logo: back to the launcher, every server. */
  .mark {
    display: flex; align-items: center; margin-right: 2px; padding: 3px;
    border: none; border-radius: var(--radius-sm); background: transparent; cursor: pointer;
  }
  .mark:hover { background: var(--bg-hover); }
  .mark svg { width: 20px; height: 20px; }
  .wsBtn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 28px; padding: 0 9px 0 8px;
    border: 1px solid transparent; border-radius: var(--radius-md);
    background: transparent; color: var(--text-primary);
    font: inherit; font-weight: 600; cursor: pointer; max-width: 360px;
  }
  .wsBtn:hover, .wsBtn.open { background: var(--bg-hover); border-color: var(--border); }
  .wsBtn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wsBtn .workspace { color: var(--text-muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wsBtn .workspace:empty { display: none; }
  .wsBtn .kind { color: var(--text-muted); display: inline-flex; }
  .wsBtn .kind svg { width: 16px; height: 16px; stroke-width: 2.4; }
  .wsBtn .chev { color: var(--text-dim); display: inline-flex; }
  .wsBtn .chev svg { width: 14px; height: 14px; stroke-width: 2.74; }
  .status { display: inline-flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: var(--fs-xs); margin-left: 4px; }
  .status:empty { display: none; }
  /* "Restart to update" pill: the one attention-seeking control in the bar. */
  .updPill {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; margin-right: 4px;
    border: 1px solid var(--accent); border-radius: var(--radius-full); background: var(--accent-bg-light); color: var(--accent);
    font-family: inherit; font-size: var(--fs-xs); font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .updPill:hover { background: var(--accent-bg); }
  .updPill svg { width: 14px; height: 14px; stroke-width: 2.74; }
  /* The sync button: what this computer keeps, summed up; its panel lists it. */
  .syncBtn {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; margin-right: 2px;
    border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--text-tertiary);
    font-family: inherit; font-size: var(--fs-xs); font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .syncBtn:hover, .syncBtn.open { background: var(--bg-hover); border-color: var(--border); color: var(--text-primary); }
  .syncBtn .ico { display: inline-flex; }
  .syncBtn svg { width: 16px; height: 16px; stroke-width: 2.4; }
  .syncBtn .text:empty { display: none; }
  .syncBtn[data-state="error"] { color: var(--danger); }
  .syncBtn[data-state="conflicts"], .syncBtn[data-state="pending"] { color: var(--warn); }

  .menu {
    position: absolute; top: 36px; left: 34px; min-width: 280px; max-width: 380px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-2);
    padding: 5px; z-index: 2;
  }
  body[data-platform="darwin"] .menu { left: 106px; }
  body[data-wco="left"] .menu:not(.right), body[data-wco="both"] .menu:not(.right) { left: 172px; }
  .menu[hidden] { display: none; }
  /* The sync panel, under its button at the bar's right end (placed by placePanel). */
  .menu.right, body[data-platform="darwin"] .menu.right { left: auto; min-width: 320px; max-width: 420px; max-height: 400px; overflow-y: auto; }
  .item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 6px 9px; border: none; border-radius: var(--radius-sm); background: transparent;
    color: var(--text-primary); font: inherit; text-align: left; cursor: pointer;
  }
  .item:hover { background: var(--bg-hover); }
  .item:focus-visible { outline-offset: -2px; }
  .item .ico { color: var(--text-muted); display: inline-flex; flex-shrink: 0; }
  .item .ico svg { width: 14px; height: 14px; stroke-width: 2.74; }
  .item .badge {
    width: 18px; height: 18px; border-radius: var(--radius-xs); flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: var(--fs-2xs); font-weight: 600; background: var(--accent-bg-light); color: var(--accent);
  }
  .item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { color: var(--text-dim); font-size: var(--fs-2xs); margin-left: 6px; }
  .item .sub.addr { font-family: var(--font-mono); }
  .item .check { color: var(--accent); display: inline-flex; width: 14px; }
  /* A kept row of the sync panel: the name over its state. */
  .item .lines { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item .lines .label { flex: none; }
  .item .lines .head { display: flex; align-items: center; min-width: 0; }
  .item .lines .head .label { flex: 0 1 auto; }
  .item .lines .state { color: var(--text-muted); font-size: var(--fs-2xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A vault's direction as two small arrows, the ones its view's Pull now
     and Push now carry: pull (Gamma to disk) and push (disk to Gamma), lit
     where it goes that way, half-lit where it pushes PDFs only, dim where
     it does not; the words are in their tooltip. */
  .dirs { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; flex-shrink: 0; color: var(--text-dim); }
  .dirs span { display: inline-flex; }
  .dirs svg { width: 12px; height: 12px; stroke-width: 2.4; }
  .dirs .on { color: var(--accent); }
  .dirs .half { opacity: 0.5; }
  /* The vault dialog and a vault's own view: the panel's second level. */
  .vaultBox { display: flex; flex-direction: column; gap: 7px; padding: 4px 9px 8px; font-size: var(--fs-xs); }
  .vaultBox .row { display: flex; gap: 8px; align-items: baseline; }
  .vaultBox .k { color: var(--text-muted); width: 56px; flex-shrink: 0; }
  .vaultBox .v { min-width: 0; overflow-wrap: anywhere; color: var(--text-primary); }
  .vaultBox .v.path { font-family: var(--font-mono); font-size: var(--fs-2xs); }
  /* A vault's switches (switchRow), one row each as Gamma's settings Toggle:
     the name at the left, its switch or choice at the right edge; the 56 px
     key column is the facts' (Local, Remote, State). */
  .vaultBox .switches { display: flex; flex-direction: column; gap: 7px; }
  .vaultBox .switchLine { display: flex; align-items: center; gap: 12px; }
  .vaultBox .switchName { flex: 1; min-width: 0; color: var(--text-primary); }
  .vaultBox .switchLine > :last-child { flex-shrink: 0; }
  .vaultBox .switch input:disabled { cursor: default; }
  .vaultBox .switch input:disabled + .switchTrack { opacity: 0.45; }
  .vaultBox .say { color: var(--text-secondary); line-height: 1.45; }
  .vaultBox .say.no { color: var(--danger); }
  .vaultBox .agentRow { display: flex; flex-direction: column; gap: 5px; }
  .vaultBox .btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .seg button { border: none; background: transparent; color: var(--text-secondary); font: inherit; font-size: var(--fs-2xs); padding: 3px 8px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover:not(:disabled) { background: var(--bg-hover); }
  .seg button[aria-pressed="true"] { background: var(--accent-bg-light); color: var(--accent); }
  .seg button:disabled { color: var(--text-dim); cursor: default; }
  /* A vault's view: its everyday actions as a bar of round buttons, each
     named by its tooltip; the rare and the grave ones keep their rows. */
  .vaultBar { display: flex; gap: 6px; padding: 2px 9px 4px; }
  .vaultBar .keepAct { width: 28px; height: 28px; }
  .vaultBar .keepAct svg { width: 14px; height: 14px; }
  .item.vaultAct[aria-disabled="true"] { opacity: 0.45; cursor: default; background: transparent; }
  .item.vaultAct.danger { color: var(--danger); }
  .item.vaultAct.danger .ico { color: var(--danger); }
  /* A workspace row's trailing chip: on a remote server "clone" (on hover)
     or, once it has one, "open clone" (always shown — click opens the
     clone); on a local clone "origin" (opens the workspace it follows). */
  .item .rowAct {
    display: none; align-items: center; gap: 4px; flex-shrink: 0;
    color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-full);
    padding: 1px 7px 1px 5px; margin-right: 2px; font-size: var(--fs-2xs); font-weight: 500; white-space: nowrap;
  }
  .item:hover .rowAct, .item:focus-within .rowAct, .item .rowAct.on { display: inline-flex; }
  .item .rowAct.on { color: var(--accent); background: var(--accent-bg-light); border-color: transparent; }
  .item .rowAct:hover { background: var(--accent-bg-light); color: var(--accent); border-color: var(--accent); }
  .item .rowAct svg { width: 14px; height: 14px; stroke-width: 2.74; }
  /* A round icon button, named by its tooltip: a kept row's actions
     (keptRow: pause or resume, sync, and a vault's menu), shown without
     hovering since a touch screen has none, and the vault view's bar. */
  .item .acts { display: inline-flex; gap: 3px; flex-shrink: 0; }
  .keepAct {
    display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0;
    padding: 0; background: transparent; color: var(--text-muted); cursor: pointer;
    border: 1px solid var(--border); border-radius: var(--radius-full);
  }
  .keepAct:hover { background: var(--accent-bg-light); color: var(--accent); border-color: var(--accent); }
  .keepAct[aria-disabled="true"] { opacity: 0.4; cursor: default; background: transparent; color: var(--text-muted); border-color: var(--border); }
  .keepAct svg { width: 13px; height: 13px; stroke-width: 2.74; }
  .item .check svg { width: 14px; height: 14px; stroke-width: 3.43; }
  .item.current { font-weight: 600; }
  .sep { height: 1px; background: var(--border); margin: 5px 4px; }
  /* A section label: Gamma's (sentence case, the text keeps its own case). */
  .menuLabel { color: var(--text-secondary); font-size: var(--fs-xs); font-weight: 600; padding: 4px 9px 2px; }
  .menuEmpty { color: var(--text-muted); font-size: var(--fs-xs); padding: 4px 9px; }

  /* The iPad and Android apps (body[data-touch], SHELLS below): a 44 px row,
     no window controls to keep clear, touch-sized targets; the menu hangs
     under the row and stops 16 px short of the bottom, scrolling the rest.
     The iPad's view reaches the screen's top edge, so there the bar paints
     the strip under the status bar itself and keeps its row below it
     (--inset-top); the Android app places its views below the status bar
     and paints that strip natively. */
  body[data-platform="ipad"] { --inset-top: env(safe-area-inset-top); }
  body[data-touch] .bar { height: calc(44px + var(--inset-top, 0px)); padding-top: var(--inset-top, 0px); padding-right: 8px; }
  body[data-touch] .mark { padding: 8px; }
  body[data-touch] .wsBtn { height: 36px; }
  body[data-touch] .status { min-width: 0; overflow: hidden; white-space: nowrap; }
  body[data-touch] .item { padding: 9px; }
  body[data-touch] .keepAct { width: 30px; height: 30px; }
  body[data-touch] .vaultBar .keepAct { width: 34px; height: 34px; }
  body[data-touch] .menu { top: calc(42px + var(--inset-top, 0px)); left: 44px; max-height: calc(100vh - 42px - var(--inset-top, 0px) - 16px); overflow-y: auto; }
</style>
</head>
<body>

  <button class="mark" id="btnHome">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="7" fill="#1e1e1c"/>
      <path d="M 6 16 C 9 10.5 13 10.5 16 16 C 19 21.5 23 21.5 26 16" stroke="#e8a020" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M 6 16 C 9 21.5 13 21.5 16 16 C 19 10.5 23 10.5 26 16" stroke="#e8a020" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M 6 4  Q 2 16 6 28" stroke="#e8a020" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.9"/>
      <path d="M 26 4 Q 30 16 26 28" stroke="#e8a020" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.9"/>
      <rect x="9" y="8" width="13" height="3" rx="0.8" fill="#eeebe4"/>
      <rect x="9" y="8" width="3" height="15" rx="0.8" fill="#eeebe4"/>
    </svg>
  </button>
  <button class="wsBtn" id="wsBtn" title="Switch workspace or server">
    <span class="kind" id="wsKind"></span>
    <span class="name" id="wsName">Servers</span>
    <span class="workspace" id="wsWorkspace"></span>
    <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
  </button>
  <span class="status" id="status"></span>
  <div class="drag"></div>
  <button class="syncBtn" id="syncBtn" hidden><span class="ico" id="syncIco"></span><span class="text" id="syncText"></span></button>
  <button class="updPill" id="btnUpdate" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
    <span id="updText"></span>
  </button>
  <button class="ctlBtn" id="btnReload" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <!-- The iPad and Android apps': hides the bar, which View › Server bar in Gamma brings back. -->
  <button class="ctlBtn" id="btnHideBar" title="Hide this bar" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>
</div>
<div class="menu" id="menu" hidden></div>
<div class="menu right" id="syncPanel" hidden></div>

<script>
  // Gamma's theme on the chrome: tokens.css derives each theme's colours
  // with its scheme's recipe, so the scheme goes beside it (DARK_THEMES in
  // Gamma's app/prefDefs.js). None reported yet — the first paint, before
  // the shell's state arrives — follows the OS, as Gamma's index.html does.
  const DARK_THEMES = ['dark', 'gamma-dark'];
  function paintTheme(theme) {
    const t = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-scheme', DARK_THEMES.includes(t) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  }
  paintTheme('');
  const ICONS = {
    local: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>',
    remote: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="m8 17 4 4 4-4"/><path d="M4.4 15.2A5 5 0 0 1 7 6a7 7 0 0 1 13.2 2.3A4.5 4.5 0 0 1 19.6 17"/></svg>',
    disk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M6 16h.01"/><path d="M10 16h.01"/></svg>',
    folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>',

    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    sync: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>',
    stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v14"/><path d="M15 5v14"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
    open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
    pull: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
    locate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
    force: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  };
  const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const ROLE = { owner: 'owner', editor: 'can edit', viewer: 'view only' };
  const $ = (id) => document.getElementById(id);
  // The shells besides the desktop's that show this page, by gammaShell's
  // platform: the iPad and Android apps, touch screens both
  // (body[data-touch], theme.css), each with its shortcuts as it writes them
  // (the iPad's key commands, the Android app's for a hardware keyboard).
  // Any other platform is the desktop's, with its menu's shortcuts.
  const SHELLS = {
    ipad: { keys: { launcher: '⌘⇧L', reload: '⌘R', hideBar: '⌘⇧B' } },
    android: { keys: { launcher: 'Ctrl+Shift+L', reload: 'Ctrl+R', hideBar: 'Ctrl+Shift+B' } },
  };
  const shell = SHELLS[gammaShell.platform] || null;
  document.body.dataset.platform = gammaShell.platform;
  if (shell) document.body.dataset.touch = '';
  const KEYS = shell ? shell.keys : { launcher: 'Ctrl+Shift+L', reload: 'Ctrl+R' };
  $('btnHome').title = `All servers (${KEYS.launcher})`;
  $('btnReload').title = `Reload (${KEYS.reload})`;
  if (KEYS.hideBar) $('btnHideBar').title = `Hide this bar (${KEYS.hideBar})`;
  let state = { servers: [], gamma: null, current: null, busy: null, theme: '' };
  // The bar's two dropdowns, one open at a time: the workspace menu under its
  // button and the sync panel under the sync button. While one is open the
  // bar view covers the window (barExpand) and a press outside closes it.
  const DROPS = { menu: { btn: 'wsBtn', panel: 'menu' }, sync: { btn: 'syncBtn', panel: 'syncPanel' } };
  let openDrop = null;
  // The sync panel's second levels: the folders of the open workspace to
  // sync with this computer ({ ws, folders, links }), and one vault's own
  // view (its key); null = the panel's list. The vault dialog
  // (state.vaultAsk, main.js askVault) comes before both while it is up.
  let chooser = null;
  let vaultView = null;
  // The dialog last shown and the one last answered (ids), and its switches as the user set them.
  let shownAsk = 0;
  let answeredAsk = 0;
  let askPick = { pull: true, push: 'off' };
  const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

  // Gamma's workspace the content view shows (null when not signed in / unknown).
  function currentWorkspace() {
    const g = state.gamma;
    if (!g) return null;
    return g.list.find((w) => w.id === g.current) || null;
  }

  function render() {
    paintTheme(state.theme);
    if (state.wco) document.body.dataset.wco = state.wco;
    else delete document.body.dataset.wco;
    const cur = state.current;
    const ws = currentWorkspace();
    // The button names the server and, once known, the Gamma workspace open
    // on it ("Alpha · Rydberg lab"); idle: "Servers".
    $('wsName').textContent = cur ? cur.name : 'Servers';
    $('wsWorkspace').textContent = ws && cur ? `· ${ws.name}` : '';
    $('wsKind').innerHTML = cur ? ICONS[cur.type] || '' : ICONS.grid;
    $('btnReload').hidden = !cur;
    // Only the iPad and Android apps' state has it, and only while a tap
    // would hide the bar (not while the launcher is up or the device's own
    // server starts).
    $('btnHideBar').hidden = !state.barHideable;
    const upd = state.update || {};
    const pill = $('btnUpdate');
    if (upd.status === 'downloaded') {
      pill.hidden = false;
      $('updText').textContent = 'Restart to update';
      pill.title = `Gamma ${upd.version} is ready — restarts the app to install it`;
    } else if (upd.status === 'available') {
      pill.hidden = false;
      $('updText').textContent = `Update: ${upd.version}`;
      pill.title = `Gamma ${upd.version} is available — opens the download page`;
    } else {
      pill.hidden = true;
    }
    const st = $('status');
    st.innerHTML = '';
    if (state.busy) {
      const s = document.createElement('span'); s.className = 'spin';
      st.appendChild(s);
      st.appendChild(document.createTextNode(state.busy));
    } else if (state.notice) {
      st.appendChild(document.createTextNode(state.notice));
    }
    renderSyncButton();
    renderMenu();
    renderSync();
  }

  function label(text) {
    const l = document.createElement('div');
    l.className = 'menuLabel';
    l.textContent = text;
    return l;
  }

  // The sync button: the worst state of everything kept, a word or two
  // (lib/keeping.js summarize). Shown once a server is open, anything is
  // kept or the vault dialog is up; never without state.keeping (the iPad
  // and Android apps keep nothing).
  function renderSyncButton() {
    const sum = (state.keeping && state.keeping.summary) || { state: 'none', text: '', title: '' };
    const b = $('syncBtn');
    b.dataset.state = sum.state;
    b.title = sum.state === 'none' ? 'Clones, Zotero links and synced vaults on this computer: none yet' : sum.title;
    $('syncIco').innerHTML = sum.state === 'busy' ? '<span class="spin"></span>'
      : sum.state === 'error' || sum.state === 'conflicts' || sum.state === 'held' ? ICONS.alert : ICONS.cloud;
    $('syncText').textContent = sum.text;
    b.hidden = !state.keeping || (!state.current && sum.state === 'none' && !state.vaultAsk);
  }

  // A vault's direction as two arrows, where its switches stand at a
  // glance: the pull arrow lit while it pulls, the push arrow lit while it
  // pushes everything and half-lit while it pushes PDFs only, the words in
  // their tooltip. The file of a vault of one file only pushes.
  const PUSHES = { off: 'pushes nothing', pdfs: 'pushes the PDFs you change here', everything: 'pushes everything you change here' };
  function dirMarks(i) {
    const said = i.scope === 'file' ? 'Pushes the file' : `${i.pull ? 'Pulls Gamma\'s changes' : 'Does not pull'}; ${PUSHES[i.push]}`;
    const pushMark = i.push === 'off' ? '' : i.push === 'pdfs' && i.scope !== 'file' ? 'on half' : 'on';
    return `<span class="dirs" title="${esc(said)}">` + (i.scope === 'file' ? '' : `<span class="${i.pull ? 'on' : ''}">${ICONS.pull}</span>`) +
      `<span class="${pushMark}">${ICONS.upload}</span></span>`;
  }

  // A kept clone, Zotero link or synced vault in the panel: its name over
  // its state (a vault's with its direction after the name), a dot for the
  // state, and its actions, always shown. A vault's `path ⇄ remote · folder`
  // is in the row's tooltip. A click opens it (a clone or
  // a link's workspace in the window, a vault's directory, or its file in
  // its directory); "pause" stops its rounds (a clone or a link detaches)
  // and "resume" starts them again; "sync" runs a round now (a detached
  // clone or link has none), and "more" opens a vault's own view, where its
  // switches and the rest are; the panel staying open on the new state
  // after each of these. A work folder whose files are not chosen yet has
  // "choose" in place of its pause: its tracking dialog, in Gamma.
  const TONE = { ok: 'on', error: 'off', conflicts: 'warn', held: 'warn', pending: 'warn', waiting: 'warn', queued: 'busy', busy: 'busy' };
  const KEPT_ICON = { clone: 'local', zotero: 'library' };
  function keptRow(i) {
    const b = document.createElement('button');
    b.className = 'item keepItem';
    b.dataset.kind = i.kind;
    if (i.scope) b.dataset.scope = i.scope;
    b.title = `${i.where}\n${i.title}`;
    // A vault of a workspace its maker left runs no round; another account's, seen by a viewer, takes no action.
    const shut = i.seen ? 'Another account\'s vault: it, or an editor of the workspace, acts on it'
      : i.away ? 'No access to its workspace: nothing is pulled or pushed' : '';
    const vault = i.seen ? ['pause', ICONS.pause, shut, true]
      : i.choosing ? ['choose', ICONS.open, 'Choose files…: what it tracks, in Gamma']
      : i.paused ? ['resume', ICONS.play, 'Resume: sync it again'] : ['pause', ICONS.pause, 'Pause: nothing is pulled or pushed until you resume it'];
    const sync = (title) => (shut ? ['sync', ICONS.sync, shut, true]
      : i.choosing ? ['sync', ICONS.sync, 'Its first round runs once its files are chosen', true] : ['sync', ICONS.sync, title]);
    const acts = { // [action, icon, title, disabled]
      clone: [
        i.paused ? ['resume', ICONS.play, 'Resume: follow the origin again; what both sides did meanwhile merges']
          : ['pause', ICONS.pause, 'Pause: nothing is pulled or pushed until you resume it; nothing is lost'],
        i.paused ? ['sync', ICONS.sync, 'Paused: resume it to sync', true] : ['sync', ICONS.sync, 'Bring it up to date now'],
      ],
      zotero: [
        i.paused ? ['resume', ICONS.play, 'Resume: sync with Zotero again; what both sides did meanwhile merges']
          : ['pause', ICONS.pause, 'Pause: nothing goes to or comes from Zotero until you resume it; nothing is lost'],
        i.paused ? ['sync', ICONS.sync, 'Paused: resume it to sync', true] : ['sync', ICONS.sync, 'Sync with Zotero now'],
      ],
      vault: i.scope === 'file'
        ? [vault, sync('Push now'), ['more', ICONS.more, 'More: locate the file, remove the vault…']]
        : [vault, sync('Sync now: push, then pull'), ['more', ICONS.more, 'More: its switches, pull now, push now, force, locate, remove the vault…']],
    }[i.kind] || [];
    b.innerHTML = `<span class="ico">${ICONS[KEPT_ICON[i.kind]] || ICONS[i.scope === 'file' ? 'file' : 'folder']}</span>` +
      `<span class="lines"><span class="head"><span class="label"></span>${i.kind === 'vault' ? dirMarks(i) : ''}</span>` +
      `<span class="state"></span></span>` +
      `<span class="dot ${TONE[i.state] || ''}"></span>` +
      `<span class="acts">${acts.map(([act, icon, title, off]) =>
        `<span class="keepAct" role="button" tabindex="${off ? -1 : 0}" data-act="${act}" title="${esc(title)}" aria-label="${esc(title)}"` +
        `${off ? ' aria-disabled="true"' : ''}>${icon}</span>`).join('')}</span>`;
    b.querySelector('.label').textContent = i.name;
    b.querySelector('.state').textContent = i.kind === 'vault' ? i.text : `${i.text} · ${i.where}`;
    b.onclick = () => (i.kind === 'vault' && i.seen ? openVault(i) : runKept(i, 'open'));
    for (const act of b.querySelectorAll('[data-act]')) {
      const go = (e) => {
        e.stopPropagation(); e.preventDefault();
        if (act.getAttribute('aria-disabled') === 'true') return;
        if (act.dataset.act === 'more') openVault(i);
        else runKept(i, act.dataset.act);
      };
      act.onclick = go;
      act.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') go(e); };
    }
    return b;
  }

  // A row's or a vault view's action (main.js keepingAction). Those that
  // change the vault or run a round leave the panel open on the new state;
  // the others ask first in a native dialog, or open something.
  const STAYS_OPEN = ['pause', 'resume', 'sync', 'pull-now', 'push-now', 'pull', 'push', 'library', 'agent', 'agent-runs', 'check-agents',
    'show-computer', 'hide-computer'];
  function runKept(i, action, value) {
    if (!STAYS_OPEN.includes(action)) closeMenu();
    gammaShell.keepingAction(i.kind, i.server, i.id, action, value).catch(() => {});
  }

  // The sync panel: the clones, the Zotero links and the synced vaults,
  // each with its state, then adding a vault and syncing a folder of the
  // open workspace (the chooser, a second level, as a vault's own view is).
  function renderSync() {
    const panel = $('syncPanel');
    panel.innerHTML = '';
    if (state.vaultAsk) {
      renderVaultAsk(panel, state.vaultAsk);
      return;
    }
    if (chooser) {
      renderChooser(panel);
      return;
    }
    const items = (state.keeping && state.keeping.items) || [];
    if (vaultView) {
      const i = items.find((x) => x.key === vaultView);
      if (i) {
        renderVault(panel, i);
        return;
      }
      vaultView = null; // gone since
    }
    const groups = [['clone', 'Clones'], ['zotero', 'Zotero links'], ['vault', 'Synced vaults']];
    for (const [kind, title] of groups) {
      const rows = items.filter((i) => i.kind === kind);
      if (!rows.length) continue;
      panel.appendChild(label(title));
      for (const i of rows) panel.appendChild(keptRow(i));
    }
    if (!items.length) {
      const none = document.createElement('div');
      none.className = 'menuEmpty';
      none.textContent = 'Nothing syncs with this computer yet.';
      none.title = 'Clone a workspace from the workspace menu, link a Zotero library in Settings › Workspaces, add a synced vault below, or right-click a folder in the library and choose Sync with this computer.';
      panel.appendChild(none);
    }
    const sep = document.createElement('div'); sep.className = 'sep'; panel.appendChild(sep);
    const add = document.createElement('button');
    add.className = 'item';
    add.id = 'addVaultBtn';
    add.innerHTML = `<span class="ico">${ICONS.plus}</span><span class="label">Add a synced vault…</span>`;
    add.title = 'A directory on this computer becomes a folder of Gamma, and you choose the files it tracks';
    add.onclick = () => { closeMenu(); gammaShell.addVault().catch(() => {}); };
    panel.appendChild(add);
    const ws = currentWorkspace();
    if (ws && state.current) {
      const b = document.createElement('button');
      b.className = 'item';
      b.id = 'syncFolderBtn';
      b.innerHTML = `<span class="ico">${ICONS.disk}</span><span class="label"></span>`;
      b.querySelector('.label').textContent = `Sync a folder of ${ws.name}…`;
      b.title = `A folder of ${ws.name} and a directory on this computer kept in step${state.current.type === 'remote' ? ', by the local server on this computer, no clone' : ''}`;
      b.onclick = () => openChooser(ws); // stays open: the folders come next
      panel.appendChild(b);
    }
  }

  // The panel's back row, from a vault's view or the folder list to the
  // panel's list, where the synced vaults are.
  function backRow(panel, onBack) {
    const back = document.createElement('button');
    back.className = 'item';
    back.id = 'panelBack';
    back.innerHTML = `<span class="ico">${ICONS.back}</span><span class="label">Synced vaults</span>`;
    back.onclick = onBack;
    panel.appendChild(back);
  }

  function boxRow(box, key, value, cls) {
    const r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = '<span class="k"></span><span class="v"></span>';
    r.querySelector('.k').textContent = key;
    r.querySelector('.v').textContent = value;
    if (cls) r.querySelector('.v').classList.add(cls);
    box.appendChild(r);
    return r;
  }

  // Push: off / PDFs / everything, as three buttons; `everything` shut where it cannot be, `noEverything` saying why;
  // with `locked`, every one but the setting shut, `locked` saying why (a work folder of another server).
  const FAR_PUSH = 'A vault of another server pushes PDFs at most: a work folder there is made from an empty folder';
  const FAR_WORK = 'A work folder of another server pushes everything and pulls: remove the vault to stop';
  const WHOLE_PUSH = 'A vault of the whole library cannot push everything: make one of a folder';
  function pushSeg(value, onPick, noEverything, locked) {
    const seg = document.createElement('span');
    seg.className = 'seg';
    seg.setAttribute('role', 'group');
    seg.setAttribute('aria-label', 'Push');
    for (const [word, text] of [['off', 'off'], ['pdfs', 'PDFs'], ['everything', 'everything']]) {
      const b = document.createElement('button');
      b.dataset.push = word;
      b.textContent = text;
      b.setAttribute('aria-pressed', String(value === word));
      if (locked && value !== word) {
        b.disabled = true;
        b.title = locked;
      } else if (word === 'everything' && noEverything) {
        b.disabled = true;
        b.title = noEverything;
      }
      b.onclick = (e) => { e.stopPropagation(); if (value !== word) onPick(word); };
      seg.appendChild(b);
    }
    return seg;
  }

  // A switch named `name`, on or off; `shut`, why it cannot be turned off (a vault of another server keeps pulling).
  function switchOf(id, name, on, onPick, shut) {
    const sw = document.createElement('label');
    sw.className = 'switch';
    sw.innerHTML = `<input type="checkbox" role="switch" id="${id}"><span class="switchTrack"></span>`;
    const input = sw.querySelector('input');
    input.setAttribute('aria-label', name);
    input.checked = on;
    if (shut && on) {
      input.disabled = true;
      sw.title = shut;
    }
    input.onchange = () => onPick(input.checked);
    return sw;
  }

  const pullSwitch = (id, on, onPick, shut) => switchOf(id, 'Pull', on, onPick, shut);

  // A work folder's agent: Off / Codex / Claude Code, as three buttons
  // (`agents`, keeping.js agentChoices); one not on this computer or not
  // ready is shut, its problem in its tooltip.
  function agentSeg(value, agents, onPick) {
    const seg = document.createElement('span');
    seg.className = 'seg';
    seg.id = 'vaultAgent';
    seg.setAttribute('role', 'group');
    seg.setAttribute('aria-label', 'Agent in this folder');
    for (const a of [{ name: '', label: 'Off' }, ...agents]) {
      const b = document.createElement('button');
      b.dataset.agent = a.name;
      b.textContent = a.label;
      b.setAttribute('aria-pressed', String(value === a.name));
      if (a.name && (a.found === false || a.ready === false)) {
        b.disabled = true;
        b.title = a.problem || `${a.label} is not ready on this computer`;
      }
      b.onclick = (e) => { e.stopPropagation(); if (value !== a.name) onPick(a.name); };
      seg.appendChild(b);
    }
    return seg;
  }

  // What the agent chosen does in the folder, under the agent row.
  const AGENT_SAYS = {
    '': 'Sends wait for an agent you run yourself.',
    codex: 'Codex answers this folder\'s Sends: it edits the files here and runs commands in its sandbox, without network.',
    claude: 'Claude Code answers this folder\'s Sends: it edits the files here and runs no commands.',
  };

  // What a work folder's agent may run beyond its confinement: Nothing more
  // ('never') / Ask me in the chat ('ask'), as two buttons.
  function runsSeg(value, onPick) {
    const seg = document.createElement('span');
    seg.className = 'seg';
    seg.id = 'vaultRuns';
    seg.setAttribute('role', 'group');
    seg.setAttribute('aria-label', 'What it may run');
    for (const [word, text] of [['never', 'Nothing more'], ['ask', 'Ask me in the chat']]) {
      const b = document.createElement('button');
      b.dataset.runs = word;
      b.textContent = text;
      b.setAttribute('aria-pressed', String(value === word));
      b.onclick = (e) => { e.stopPropagation(); if (value !== word) onPick(word); };
      seg.appendChild(b);
    }
    return seg;
  }

  // What the agent on may run, and may ask for, under the row What it may run.
  const RUNS_SAYS = {
    codex: 'Codex runs commands in its sandbox, without network; with Ask, it can ask in the chat to go further (the network, files outside this folder).',
    claude: 'Claude Code edits the files here and runs no commands; with Ask, it can ask in the chat to run one (your build).',
  };

  // A work folder's agent row (its maker's alone): the segment, then as
  // visible lines the problem of the chosen agent and of each one that
  // cannot be chosen, what the chosen one does, and what it does now; with
  // an agent on, the row What it may run and its line (none for a work
  // folder of another server, whose agent asks nothing in the chat).
  function agentRow(i) {
    const box = document.createElement('div');
    box.className = 'agentRow';
    box.appendChild(switchRow([['Agent in this folder', agentSeg(i.agent, i.agents, (name) => runKept(i, 'agent', name))]]));
    const line = (text, no) => {
      const say = document.createElement('div');
      say.className = `say${no ? ' no' : ''}`;
      say.textContent = text;
      box.appendChild(say);
    };
    const problems = new Set();
    if (i.agent && i.agentReady === false && i.agentProblem) problems.add(i.agentProblem);
    for (const a of i.agents) if (a.ready !== true && a.problem) problems.add(a.problem);
    for (const p of problems) line(p, true);
    line(AGENT_SAYS[i.agent] || AGENT_SAYS[''], false);
    if (i.agentRunning) line(`Now: ${i.agentLabel} is working · ${i.agentRunning}`, false);
    if (i.agent && !i.remoteUrl) {
      box.appendChild(switchRow([['What it may run', runsSeg(i.agentRuns, (word) => runKept(i, 'agent-runs', word))]]));
      if (RUNS_SAYS[i.agent]) line(RUNS_SAYS[i.agent], false);
    }
    return box;
  }

  // A vault's switches, a row each, its name at the left and its control at
  // the right edge: `[name, control]` pairs, Pull then Push, a work folder's
  // library switch, its agent and what that may run.
  function switchRow(pairs) {
    const sw = document.createElement('div');
    sw.className = 'switches';
    for (const [name, control] of pairs) {
      const line = document.createElement('div'); line.className = 'switchLine';
      const k = document.createElement('span'); k.className = 'switchName'; k.textContent = name;
      line.append(k, control);
      sw.appendChild(line);
    }
    return sw;
  }

  // What the directory holds, as /preview found it.
  function foundText(p) {
    if (p.empty) return 'Nothing: an empty directory';
    const parts = [p.notes && count(p.notes, 'note'), p.pdfs && count(p.pdfs, 'PDF'), p.pictures && count(p.pictures, 'picture'),
      p.untracked && `${p.untracked} untracked`].filter(Boolean);
    return parts.length ? parts.join(', ') : 'No notes or PDFs';
  }

  // The vault dialog (main.js askVault): the directory, what was found
  // there, the switches Pull and Push, the sentence that says what the
  // first round does for them as they stand, Sync and Cancel. Closing the
  // panel cancels it too.
  function renderVaultAsk(panel, a) {
    panel.appendChild(label(a.newFolder ? 'Add a synced vault' : `Sync “${a.folder}” with this computer`));
    const box = document.createElement('div');
    box.className = 'vaultBox';
    box.id = 'vaultAsk';
    boxRow(box, 'Local', a.path, 'path');
    boxRow(box, 'Remote', `${a.server} · ${a.workspace} · ${a.newFolder ? `a new folder “${a.folder}”` : a.folder}`);
    boxRow(box, 'Found', foundText(a.preview || {}));
    box.appendChild(switchRow([['Pull', pullSwitch('askPull', askPick.pull, (on) => { askPick = { ...askPick, pull: on }; renderSync(); })],
      ['Push', pushSeg(askPick.push, (word) => { askPick = { ...askPick, push: word }; renderSync(); },
        a.remote ? FAR_PUSH : a.whole ? WHOLE_PUSH : '')]]));
    const said = (a.sentences || {})[`${askPick.pull}:${askPick.push}`] || { ok: false, text: '' };
    const say = document.createElement('div');
    say.className = `say${said.ok ? '' : ' no'}`;
    say.id = 'vaultSay';
    say.textContent = said.text;
    box.appendChild(say);
    const btns = document.createElement('div');
    btns.className = 'btns';
    const cancel = document.createElement('button');
    cancel.className = 'uiBtn sm';
    cancel.id = 'vaultCancel';
    cancel.textContent = 'Cancel';
    cancel.onclick = () => closeMenu();
    const go = document.createElement('button');
    go.className = 'uiBtn sm primary';
    go.id = 'vaultSync';
    go.textContent = 'Sync';
    go.disabled = !said.ok;
    go.onclick = () => {
      const id = a.id;
      answeredAsk = id;
      gammaShell.answerVault(id, askPick).then((ok) => { if (!ok) gammaShell.answerVault(id, null); }).catch(() => {});
      closeMenu();
    };
    btns.append(cancel, go);
    box.appendChild(btns);
    panel.appendChild(box);
  }

  // A work folder's view of its maker looks for the agents on this computer
  // again (main.js checkAgents), so its agent row offers what is there now.
  function openVault(i) {
    vaultView = i.key;
    renderSync();
    if (i.agentHere && i.mine && i.agents) runKept(i, 'check-agents');
  }

  // A vault's own view: where it is and how it stands, its switches (a work
  // folder's library switch among them), and every action. The everyday ones
  // are a bar of buttons under the switches — the rounds (Sync now, Pull now,
  // Push now), Pause or Resume, and the directory — each named by its
  // tooltip; the rare and the grave ones keep their rows, where their words
  // warn: Choose files… for a work folder (its tracking dialog, in Gamma), Go
  // on… for a vault its guard held, Locate… for one whose directory or file
  // is not where it was, Force pull… and Force push…, Show this computer
  // there or Stop showing for a vault of another server (under its State,
  // whether this computer is shown there), Remove the vault….
  function renderVault(panel, i) {
    backRow(panel, () => { vaultView = null; renderSync(); });
    panel.appendChild(label(i.name));
    const box = document.createElement('div');
    box.className = 'vaultBox';
    box.id = 'vaultView';
    boxRow(box, 'Local', i.seen ? 'On the computer of the account that made it' : i.dest, i.seen ? '' : 'path');
    boxRow(box, 'Remote', `${i.remote}${i.folder ? ` · ${i.folder}` : ''}`);
    boxRow(box, 'State', i.text).title = i.title;
    // A vault of another server: whether this computer is shown there (keeping.js computerLine).
    if (i.computer) {
      const say = document.createElement('div');
      say.className = `say${i.computer.state === 'refused' || i.computer.state === 'older' ? ' no' : ''}`;
      say.id = 'vaultComputer';
      say.textContent = i.computer.text;
      say.title = i.computer.title;
      box.appendChild(say);
    }
    // A vault of a workspace its maker left runs no round; another account's, seen by a viewer, takes no action.
    const shut = i.seen ? 'Another account made this vault: it, or an editor of the workspace, acts on it.'
      : i.away ? 'Your account is no longer a member of its workspace: nothing is pulled or pushed.' : '';
    if (i.scope === 'folder') {
      // a vault of another server keeps pulling; a work folder there pushes everything too, both locked
      const farWork = Boolean(i.remoteUrl && i.work);
      const rows = [switchRow([['Pull', pullSwitch('vaultPull', i.pull, (on) => runKept(i, 'pull', on),
        farWork ? FAR_WORK : i.remoteUrl && 'A vault of another server pulls')],
        ['Push', pushSeg(i.push, (word) => runKept(i, 'push', word),
          farWork ? '' : i.remoteUrl ? FAR_PUSH : i.whole && i.push !== 'everything' ? WHOLE_PUSH : '', farWork ? FAR_WORK : '')]])];
      // a work folder's switch: whether the PDFs and notes it finds are added to the library too
      if (i.work) rows.push(switchRow([['Add its PDFs and notes to the library', switchOf('vaultLibrary', 'Add its PDFs and notes to the library', i.library, (on) => runKept(i, 'library', on))]]));
      // and its agent, its maker's choice on a server that runs agents (one of another server once this computer is shown there)
      if (i.agentHere && i.mine && i.agents) rows.push(agentRow(i));
      for (const sw of rows) {
        if (shut) {
          sw.title = shut;
          for (const input of sw.querySelectorAll('input, button')) input.disabled = true;
        }
        box.appendChild(sw);
      }
    }
    if (shut) {
      const say = document.createElement('div');
      say.className = 'say';
      say.textContent = shut;
      box.appendChild(say);
    }
    panel.appendChild(box);
    const folder = i.scope === 'folder';
    const rounds = !shut && !i.choosing; // a work folder whose files are not chosen yet runs no round
    const quick = [ // [action, icon, title, shown, disabled]
      ['sync', ICONS.sync, folder ? 'Sync now: push, then pull' : 'Push now', rounds],
      ['pull-now', ICONS.pull, 'Pull now: Gamma\'s changes to this computer', rounds && folder, !i.pull],
      ['push-now', ICONS.upload, 'Push now: this computer\'s changes to Gamma', rounds && folder, i.push === 'off'],
      i.paused ? ['resume', ICONS.play, 'Resume: sync it again', !i.seen && !i.choosing]
        : ['pause', ICONS.pause, 'Pause: nothing is pulled or pushed until you resume it', !i.seen],
      ['open', ICONS.open, folder ? 'Open the directory' : 'Show the file in its folder', !i.seen],
    ];
    const bar = document.createElement('div');
    bar.className = 'vaultBar';
    bar.id = 'vaultBar';
    for (const [act, icon, title, shown, off] of quick) {
      if (!shown) continue;
      const b = document.createElement('button');
      b.className = 'keepAct vaultAct';
      b.dataset.act = act;
      b.title = title;
      b.setAttribute('aria-label', title);
      b.innerHTML = icon;
      if (off) b.setAttribute('aria-disabled', 'true');
      b.onclick = () => { if (!off) runKept(i, act); };
      bar.appendChild(b);
    }
    if (bar.children.length) panel.appendChild(bar);
    const rows = document.createDocumentFragment();
    const acts = [ // [action, icon, label, shown, disabled, danger]
      ['choose', ICONS.open, 'Choose files…', !shut && i.work],
      ['go-on', ICONS.play, 'Go on…', rounds && Boolean(i.held)],
      ['locate', ICONS.locate, folder ? 'Locate…' : 'Locate the file…', !i.seen && (!folder || Boolean(i.stopped) || i.offline)],
      ['force-pull', ICONS.force, 'Force pull…', rounds && folder],
      ['force-push', ICONS.force, 'Force push…', rounds && folder],
      // this computer shown on a vault of another server's server, or no longer
      i.computer ? [i.computer.action, i.computer.action === 'show-computer' ? ICONS.remote : ICONS.pause, i.computer.button, true] : null,
      ['remove', ICONS.stop, 'Remove the vault…', !i.seen, false, true],
    ].filter(Boolean);
    for (const [act, icon, text, shown, off, danger] of acts) {
      if (!shown) continue;
      const b = document.createElement('button');
      b.className = `item vaultAct${danger ? ' danger' : ''}`;
      b.dataset.act = act;
      b.innerHTML = `<span class="ico">${icon}</span><span class="label"></span>`;
      b.querySelector('.label').textContent = text;
      if (off) b.setAttribute('aria-disabled', 'true');
      b.onclick = () => { if (!off) runKept(i, act); };
      rows.appendChild(b);
    }
    if (bar.children.length && rows.childNodes.length) {
      const sep = document.createElement('div'); sep.className = 'sep';
      panel.appendChild(sep);
    }
    panel.appendChild(rows);
  }

  // "Sync a folder with this computer": the folders of the open workspace,
  // each synced already (a click opens its directory) or not (a click asks
  // for the directory, then shows the vault dialog). On a remote server the
  // vault lives on this computer's local server and reads the folder from
  // there.
  function openChooser(w) {
    chooser = { ws: w, folders: null, links: [] };
    renderSync();
    gammaShell.folders(w.id).then((r) => {
      if (!chooser || chooser.ws.id !== w.id) return;
      chooser = { ws: w, folders: r.folders || [], links: r.links || [] };
      renderSync();
    }).catch(() => { chooser = null; renderSync(); });
  }

  function renderChooser(panel) {
    const { ws, folders, links } = chooser;
    const remote = state.current && state.current.type === 'remote';
    backRow(panel, () => { chooser = null; renderSync(); });
    panel.appendChild(label(`Sync a folder of ${ws.name}${remote ? ', no clone' : ''}`));
    if (folders === null) {
      const l = document.createElement('div'); l.className = 'menuEmpty'; l.textContent = 'reading the folders…';
      panel.appendChild(l);
      return;
    }
    const rows = [{ id: 'root', name: 'Whole library', icon: ICONS.library }, ...folders.map((f) => ({ id: f.id, name: f.path.join(' / '), icon: ICONS.folder }))];
    for (const f of rows) {
      const link = links.find((l) => l.folder_id === f.id);
      const b = document.createElement('button');
      b.className = 'item folderItem';
      b.dataset.folder = f.id;
      b.title = link ? `Synced with ${link.dest}. Click to open it.`
        : `Sync ${f.name} with a directory on this computer, by ${remote ? 'the local server on this computer, no clone' : 'this server'}`;
      b.innerHTML = `<span class="ico">${f.icon}</span><span class="label"></span>` +
        (link ? `<span class="rowAct on" title="${esc(link.dest)}">${ICONS.open}synced</span>` : `<span class="rowAct">${ICONS.disk}sync…</span>`);
      b.querySelector('.label').textContent = f.name;
      b.onclick = () => {
        closeMenu();
        if (link) gammaShell.openPath(ws.id, link.dest).catch(() => {});
        else gammaShell.addFolderVault(ws.id, f.id).catch(() => {});
      };
      panel.appendChild(b);
    }
  }

  function renderMenu() {
    const menu = $('menu');
    menu.innerHTML = '';
    // Gamma's workspaces on the open server first: the everyday switch.
    const g = state.gamma;
    if (state.current && g && g.list.length) {
      menu.appendChild(label(`Workspaces · ${state.current.name}`));
      for (const w of g.list) {
        const isCur = w.id === g.current;
        const b = document.createElement('button');
        b.className = 'item wsItem' + (isCur ? ' current' : '');
        b.dataset.ws = w.id;
        b.title = w.mirror_of ? `Clone of ${w.mirror_of} — pulls from and pushes to its origin whenever it is reachable`
          : w.personal ? 'Your personal workspace' : `Shared · ${w.members} member${w.members === 1 ? '' : 's'} · you ${ROLE[w.role] || w.role}`;
        if (w.copy) b.title += ` · has a clone on ${w.copy.serverName}`;
        // The trailing chip (see .rowAct): open the clone / open the origin /
        // clone, the last only with state.keeping (the iPad and Android apps make no clones).
        const chip = w.copy
          ? `<span class="rowAct on" role="button" tabindex="0" data-act="copy" title="Open the clone on ${esc(w.copy.serverName)}${w.copy.running ? ' — syncing in the background' : ''}">${ICONS.local}open clone</span>`
          : w.original
          ? `<span class="rowAct on" role="button" tabindex="0" data-act="original" title="Open the origin: ${esc(w.original.name)} on ${esc(w.original.serverName)}">${ICONS.remote}origin</span>`
          : state.keeping && state.current.type === 'remote' && !w.mirror_of
          ? `<span class="rowAct" role="button" tabindex="0" data-act="keep" title="Clone ${esc(w.name)} onto this computer — opens without a connection, pulls and pushes changes">${ICONS.download}clone</span>`
          : '';
        b.innerHTML = `<span class="badge"></span><span class="label"></span><span class="sub"></span>` +
          chip + `<span class="check">${isCur ? ICONS.check : ''}</span>`;
        b.querySelector('.badge').textContent = (w.name || '?').charAt(0).toUpperCase();
        b.querySelector('.label').textContent = w.name;
        b.querySelector('.sub').textContent = w.mirror_of ? 'clone' : w.personal ? 'personal' : (ROLE[w.role] || w.role);
        b.onclick = () => { closeMenu(); if (!isCur) gammaShell.openWorkspace(w.id).catch(() => {}); };
        for (const act of b.querySelectorAll('.rowAct')) {
          const kind = act.dataset.act;
          const go = (e) => {
            e.stopPropagation(); e.preventDefault();
            closeMenu();
            const run = kind === 'copy' ? gammaShell.openCopy : kind === 'original' ? gammaShell.openOriginal : gammaShell.keepOffline;
            run(w.id).catch(() => {});
          };
          act.onclick = go;
          act.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') go(e); };
        }
        menu.appendChild(b);
      }
      const sep = document.createElement('div'); sep.className = 'sep'; menu.appendChild(sep);
    }
    menu.appendChild(label('Servers'));
    for (const srv of state.servers) {
      const isCur = state.current && state.current.id === srv.id;
      const b = document.createElement('button');
      b.className = 'item' + (isCur ? ' current' : '');
      b.dataset.id = srv.id;
      b.innerHTML = `<span class="ico">${ICONS[srv.type] || ''}</span><span class="label"></span>` +
        (srv.type === 'local'
          ? (srv.url ? `<span class="sub addr" title="Its address, the one to give the Gamma Connector">${esc(new URL(srv.url).host)}</span>` : '') +
            `<span class="dot ${srv.running ? 'on' : ''}" title="${srv.running ? 'server running' : 'stopped'}"></span>`
          : `<span class="sub">remote</span><span class="dot ${srv.reachable === true ? 'on' : srv.reachable === false ? 'off' : ''}" title="${srv.reachable === true ? 'reachable' : srv.reachable === false ? 'unreachable' : 'checking…'}"></span>`) +
        `<span class="check">${isCur ? ICONS.check : ''}</span>`;
      b.querySelector('.label').textContent = srv.name;
      b.onclick = () => { closeMenu(); if (!isCur) gammaShell.open(srv.id).catch(() => {}); };
      menu.appendChild(b);
    }
    if (!state.servers.length) {
      const none = document.createElement('div');
      none.className = 'menuEmpty';
      none.textContent = 'none yet';
      menu.appendChild(none);
    }
    const sep = document.createElement('div'); sep.className = 'sep'; menu.appendChild(sep);
    const all = document.createElement('button');
    all.className = 'item';
    all.id = 'menuLauncher';
    all.innerHTML = `<span class="ico">${ICONS.plus}</span><span class="label">All servers…</span><span class="sub">${KEYS.launcher}</span>`;
    all.onclick = () => { closeMenu(); gammaShell.launcher(); };
    menu.appendChild(all);
  }

  // The sync panel sits under its button, its right edge on the button's.
  function placePanel() {
    const r = $('syncBtn').getBoundingClientRect();
    $('syncPanel').style.right = `${Math.max(8, window.innerWidth - r.right)}px`;
  }
  function openDropdown(which) {
    closeMenu();
    openDrop = which;
    $(DROPS[which].btn).classList.add('open');
    $(DROPS[which].panel).hidden = false;
    if (which === 'sync') placePanel();
    gammaShell.barExpand(true);
    // Fresh on every open: servers added and workspaces joined, or what is kept, since the last push.
    if (which === 'menu') gammaShell.state().then((s) => { state = s; render(); });
    else gammaShell.keeping().then((k) => { state = { ...state, keeping: k }; render(); });
  }
  // Closes whichever dropdown is open. The sync panel closed while it shows
  // the vault dialog cancels the dialog.
  function closeMenu() {
    if (!openDrop) return;
    const d = DROPS[openDrop];
    const ask = openDrop === 'sync' && state.vaultAsk;
    openDrop = null;
    chooser = null;
    vaultView = null;
    $(d.btn).classList.remove('open');
    $(d.panel).hidden = true;
    gammaShell.barExpand(false);
    if (ask && answeredAsk !== ask.id) {
      answeredAsk = ask.id;
      gammaShell.answerVault(ask.id, null).catch(() => {});
    }
  }
  const toggle = (which) => () => { openDrop === which ? closeMenu() : openDropdown(which); };
  $('wsBtn').onclick = toggle('menu');
  $('syncBtn').onclick = toggle('sync');
  $('btnHome').onclick = () => { closeMenu(); gammaShell.launcher(); };
  // A press outside the open dropdown and its buttons closes it. Not a click:
  // iOS sends none for a tap on the bare see-through page.
  document.addEventListener('pointerdown', (e) => { if (openDrop && !e.target.closest('.menu, #wsBtn, #syncBtn')) closeMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
  // The window losing the focus closes a dropdown, but not the vault dialog,
  // which waits for Sync or Cancel (a look at the directory meanwhile is fine).
  window.addEventListener('blur', () => { if (!(openDrop === 'sync' && state.vaultAsk)) closeMenu(); });
  $('btnReload').onclick = () => gammaShell.reload();
  $('btnHideBar').onclick = () => { closeMenu(); gammaShell.hideBar(); };
  $('btnUpdate').onclick = () => gammaShell.updateInstall();

  // A state with a vault dialog not shown yet opens the sync panel on it,
  // its switches as main.js starts them; one still waiting opens the panel
  // again should it have closed without an answer (main.js keeps the bar
  // expanded while it waits, so the two never part).
  function takeState(s) {
    state = s;
    const ask = s.vaultAsk;
    if (ask && ask.id !== answeredAsk && (ask.id !== shownAsk || openDrop !== 'sync')) {
      if (ask.id !== shownAsk) askPick = { pull: Boolean(ask.pull), push: ask.push || 'off' };
      shownAsk = ask.id;
      render();
      if (openDrop !== 'sync') openDropdown('sync');
      return;
    }
    render();
  }
  gammaShell.onState(takeState);
  gammaShell.state().then(takeState);
</script>
</body>
</html>
