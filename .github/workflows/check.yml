# Pull-request check: the fast half of what a merge to main would build,
# so a broken main (whose merge publishes the Docker image) is caught on
# the PR instead. Backend tests, frontend unit tests + build, the desktop
# shell's unit tests, the browser suite against an isolated backend, the
# extension's tests and zip, the mobile apps' pins resolved; no installers.
# The account server (cloud/) is checked by cloud.yml and the website
# (sites/) by site.yml instead, so a PR that only touches those skips this
# (docker.yml's paths-ignore is the same list: keep the two alike). The
# merge skill waits for this before merging. Overview:
# docs/dev/github_actions.md.

name: check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
      - ".claude/skills/update-account-server/**"
      - ".claude/skills/update-demo-server/**"
      - ".claude/skills/update-share-host/**"
      - "docs/dev/cloud_accounts.md"
      - "sites/**"
      - ".github/workflows/site.yml"
      - ".claude/skills/build-site/**"
      - "PRIVACY.md"
      - "TERMS.md"
      - "DELETE_ACCOUNT.md"

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/branding/build.mjs --check
      - run: node --test tools/branding/check.test.mjs

  # Every pin in backend/requirements-mobile.txt still resolves to wheels
  # for the iPad (device and simulator) and Android (arm64 and x86_64), so
  # one that stops resolving fails here, not in ipad.yml's macOS run or
  # android.yml's build (which a backend-only PR starts neither of).
  mobile-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pip runs under the apps' Python version, so environment markers
      # resolve as they do on the devices.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Through bash: the script's executable bit does not survive a commit
      # from a Windows checkout.
      - run: bash tools/check_mobile_pins.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # the suite takes ~3; pytest.ini ends a single hung test at 300 s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - working-directory: backend
        run: python -m pytest tests -q -n auto --dist loadfile

  # The same suite on the iPad's and Android's Python with their pins
  # (backend/requirements-mobile.txt), so a server change that breaks only
  # in the apps fails on the PR and not on a device.
  backend-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mobile.txt -r requirements-dev.txt
      - working-directory: backend
        run: python -m pytest tests -q -n auto --dist loadfile

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      # the desktop shell's unit tests: its pure modules (desktop/lib/) and
      # main.js under a stand-in for Electron, with Node's built-ins alone,
      # so no install; the Electron suite itself is run by hand
      - run: node --test desktop/test/*.test.js

  # The browser suite (frontend/tests/e2e): a real backend from this
  # checkout over a throwaway data dir, Playwright's Chromium driving the
  # built app, split in two shards of about equal time on two runners. On a
  # failure the harness's screenshots + log tails are uploaded as the
  # `e2e-failures-<shard>` artifact (docs/dev/debugging.md).
  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # the other shard's failures are worth seeing too
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # -dev too: the transfer scenario builds its Zotero fixture from a
          # backend test module (backend/tests/test_zotero_import.py).
          pip install -r requirements.txt -r requirements-dev.txt
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium-headless-shell
      - working-directory: frontend
        env:
          GAMMA_E2E_PYTHON: python
          TMPDIR: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$TMPDIR"
          # 3 workers on the runner's 4 cores, measured no flakier than 2: ~3 min a shard
          npm run e2e -- --continue --jobs 3 --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e/gamma-e2e-*/failures/
          if-no-files-found: ignore

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The pure modules' unit tests (docs/dev/extension.md#testing); the
      # .e2e.mjs files need Playwright's full Chromium and are run by hand.
      - run: node --test extension/tests/*.test.mjs
      # The zip builds as a release makes it (extension/scripts/zip.sh),
      # with a pre-release version split into version and version_name; the
      # other scripts only run inside Chrome, so there is no useful
      # `node --check` here.
      - run: |
          bash extension/scripts/zip.sh 0.0.0-check "$RUNNER_TEMP/gamma-connector-check.zip"
          unzip -p "$RUNNER_TEMP/gamma-connector-check.zip" manifest.json | jq -e '.version == "0.0.0" and .version_name == "0.0.0-check"'
          unzip -l "$RUNNER_TEMP/gamma-connector-check.zip" | tail -1
