# Desktop app: the Windows installer, macOS dmg/zip and Debian/Ubuntu deb,
# published as the GitHub Release `v<version>` (version =
# desktop/package.json). Overview of every workflow: docs/dev/github_actions.md.
#
# Runs on every push to main that touches the app or what it bundles
# (desktop/, backend/, frontend/) and by hand from the Actions tab. Every run
# builds and smoke-tests all three platforms; the GitHub Release is created
# only when the `v<version>` tag does not exist yet. So a merge without a
# version bump is a build check whose installers stay workflow artifacts,
# and bumping desktop/package.json is what releases. The tag is created by
# the release step itself — nobody pushes tags by hand. The browser
# extension has its own workflow (extension.yml), the Docker image too
# (docker.yml).
#
# Every installer bundles the frozen backend (PyInstaller) + built frontend,
# so a released app is fully self-contained — no Python or Node needed.
#
# Code signing is optional and driven entirely by repository secrets
# (desktop/electron-builder.cjs turns each piece on only when its secrets are
# present, so a fork without them still builds — unsigned):
#   Windows, Azure Trusted Signing:  AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET (an Entra app registration with the "Trusted
#     Signing Certificate Profile Signer" role), AZURE_SIGN_ENDPOINT
#     (e.g. https://eus.codesigning.azure.net), AZURE_SIGN_ACCOUNT,
#     AZURE_SIGN_PROFILE, optional AZURE_SIGN_PUBLISHER (cert subject, "CN=…").
#   macOS, Developer ID + notarization:  MAC_CERT_P12 (base64 of the
#     "Developer ID Application" .p12), MAC_CERT_PASSWORD, APPLE_ID,
#     APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
# Unsigned builds: Windows shows SmartScreen (More info -> Run anyway), macOS
# refuses to open ("damaged") until `xattr -dr com.apple.quarantine`. The
# Linux .deb has no signing at all (apt trusts repositories, not files);
# the Linux job installs it on the runner and runs the smoke test from
# /opt/Gamma to prove the package and its dependency list are sound.
#
# The Windows job also builds the Microsoft Store package (unsigned MSIX,
# `store-windows` artifact) for manual upload to Partner Center; it is NOT a
# release asset because nobody can install it before the Store signs it.

name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (blank = desktop/package.json)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release (installed apps ignore those)"
        type: boolean
        default: false
      publish:
        description: "Create the GitHub Release when the tag is new (off = artifacts only)"
        type: boolean
        default: true

# Two merges in a row queue instead of racing for the same tag.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          version="$IN_VERSION"
          [ -z "$version" ] && version=$(node -p "require('./desktop/package.json').version")
          tag="v$version"
          publish=true
          if [ "$IN_PUBLISH" = "false" ]; then
            publish=false
            echo "::notice::publish=false — building artifacts only"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            publish=false
            echo "::notice::tag $tag already exists — build only; bump desktop/package.json to release"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Gamma $version from $GITHUB_SHA (publish=$publish)"

  desktop:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Signing credentials (see the header). Empty secrets = unsigned build;
      # electron-builder must then not go hunting for certs in the runner's
      # keychain. The mac certificate is NOT exported as CSC_LINK here: an
      # env entry always exists, and electron-builder treats an empty
      # CSC_LINK as a certificate path ("… not a file"). The macOS build step
      # exports CSC_LINK / CSC_KEY_PASSWORD only when MAC_CERT_P12 is set,
      # which also keeps them away from Windows (there they would shadow
      # Azure signing and the unsigned Store package).
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12 != '' }}
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
      AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin the app version
        if: inputs.version != ''
        working-directory: desktop
        shell: bash
        run: npm version "${{ needs.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Freeze backend
        run: python desktop/build_backend.py

      - name: Smoke-test frozen backend
        shell: bash
        run: |
          BIN=desktop/dist-backend/gamma-server/gamma-server
          [ "$RUNNER_OS" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --port 9317 --data-dir "$RUNNER_TEMP/gamma-smoke" &
          SERVER_PID=$!
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9317/api/health >/dev/null 2>&1; then
              echo "healthy"; kill $SERVER_PID; exit 0
            fi
            sleep 1
          done
          echo "frozen server never became healthy"; kill $SERVER_PID; exit 1

      # Per-OS build steps: PowerShell on Windows (the runner default, as the
      # first releases ran), bash on macOS where the signing env is exported.
      # The config is electron-builder.cjs, never .js: cmd.exe would resolve
      # `npx electron-builder` to that file via PATHEXT and build nothing.
      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: |
          if ($env:AZURE_CLIENT_ID) { Write-Host "::notice::Windows: signing with Azure Trusted Signing" } else { Write-Host "::warning::Windows: UNSIGNED build (no AZURE_* secrets)" }
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx electron-builder --publish never
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Build desktop app (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            echo "::notice::macOS: signing with Developer ID (notarize=$([ -n "$APPLE_ID" ] && echo yes || echo no))"
            export CSC_LINK="$MAC_CERT_P12" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          else
            echo "::warning::macOS: UNSIGNED build (no MAC_CERT_P12 secret)"
          fi
          npm ci
          npx electron-builder --publish never

      # Linux: the .deb (electron-builder.cjs `linux`); nothing to sign.
      - name: Build desktop app (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npx electron-builder --publish never
          ls -la dist

      - name: Verify signature
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            [ -z "$AZURE_CLIENT_ID" ] && exit 0
            exe=$(ls dist/*.exe | head -1)
            powershell -NoProfile -Command "\$s = Get-AuthenticodeSignature '$exe'; \$s | Format-List Status, StatusMessage, SignerCertificate; if (\$s.Status -ne 'Valid') { exit 1 }"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            [ -z "$MAC_CERT_P12" ] && exit 0
            app=$(ls -d dist/mac*/Gamma.app | head -1)
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -d --entitlements - "$app/Contents/Resources/gamma-server/gamma-server" | head -20
            if [ -n "$APPLE_ID" ]; then
              spctl --assess --type execute --verbose=2 "$app"
              xcrun stapler validate "$app"
            fi
          fi

      # Electron needs a display on Linux; the runner has none, so Xvfb.
      - name: Shell self-test (packaged app)
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }
            xvfb-run -a node test/smoke.js --packaged
          else
            node test/smoke.js --packaged
          fi

      # The actual deliverable: apt resolves the package's dependency list,
      # the postinst sets up chrome-sandbox / the AppArmor profile, and the
      # installed binary passes the same self-test with the sandbox ON.
      - name: Install the .deb and self-test it
        if: runner.os == 'Linux'
        working-directory: desktop
        shell: bash
        run: |
          sudo apt-get install -y ./dist/Gamma-*.deb
          dpkg -s gamma-desktop | head -5
          ls -la /opt/Gamma/gamma /opt/Gamma/resources/gamma-server/gamma-server /usr/bin/gamma
          xvfb-run -a /opt/Gamma/gamma --smoke | tee smoke-installed.log
          grep -q '^SMOKE {"ok":true' smoke-installed.log

      # Store package: deliberately unsigned (the AZURE_* env is blanked so
      # electron-builder does not sign the exe/appx with the Trusted Signing
      # cert — the manifest publisher must stay the Partner Center GUID), in
      # its own output dir so it does not touch the installer or win-unpacked.
      - name: Build Store package (MSIX)
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          AZURE_TENANT_ID: ""
          AZURE_CLIENT_ID: ""
          AZURE_CLIENT_SECRET: ""
          AZURE_SIGN_ENDPOINT: ""
          AZURE_SIGN_ACCOUNT: ""
          AZURE_SIGN_PROFILE: ""
          AZURE_SIGN_PUBLISHER: ""
        run: |
          npx electron-builder --win appx --publish never --config.directories.output=dist-store
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist-store

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: store-windows
          path: desktop/dist-store/*.appx
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [meta, desktop]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: desktop-*
          merge-multiple: true
      - name: Release notes
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          WIN_SIGNED: ${{ secrets.AZURE_CLIENT_ID != '' }}
          MAC_SIGNED: ${{ secrets.MAC_CERT_P12 != '' && secrets.APPLE_ID != '' }}
        run: |
          ls -la assets
          base="https://github.com/$REPO/releases/download/$TAG"
          asset() { ls assets | grep -E "$1" | head -1; }
          exe=$(asset '\.exe$'); dmg=$(asset '\.dmg$'); zipmac=$(asset 'mac.*\.zip$|darwin.*\.zip$'); deb=$(asset '\.deb$')
          {
            echo "## Desktop app $VERSION"
            echo
            echo "| Platform | Download |"
            echo "|---|---|"
            [ -n "$exe" ] && echo "| Windows 10/11 (x64) | [$exe]($base/$exe) |"
            [ -n "$dmg" ] && echo "| macOS (Apple Silicon) | [$dmg]($base/$dmg) |"
            [ -n "$zipmac" ] && echo "| macOS (zip) | [$zipmac]($base/$zipmac) |"
            [ -n "$deb" ] && echo "| Debian / Ubuntu (x64) | [$deb]($base/$deb) |"
            echo
            echo -n "Self-contained: no Python or Node needed."
            [ "$WIN_SIGNED" = "true" ] && echo -n " Windows build is code-signed (Azure Trusted Signing)." || echo -n " Windows build is unsigned — SmartScreen: *More info → Run anyway* (Edge: *… → Keep → Keep anyway*)."
            [ "$MAC_SIGNED" = "true" ] && echo -n " macOS build is signed and notarized." || echo -n " macOS build is unsigned — if it says *damaged*, run \`xattr -dr com.apple.quarantine /Applications/Gamma.app\` once (or *Open Anyway* in System Settings → Privacy & Security)."
            [ -n "$deb" ] && echo " Linux: \`sudo apt install ./$deb\` (installs to \`/opt/Gamma\`, command \`gamma\`)." || echo
            echo
            echo "Installed apps update themselves from this page (Help → *Check for Updates…*; Windows installs on restart, Linux asks for your password to run dpkg, macOS offers the download until builds are signed). The \`latest*.yml\` and \`.blockmap\` assets are that update feed."
            echo
            echo "## Browser extension"
            echo
            echo "The Gamma Connector has its own releases, tagged \`extension-v<version>\`: [latest extension release](https://github.com/$REPO/releases?q=extension-v&expanded=true)."
            echo
            echo "## Server (Docker)"
            echo
            echo '```bash'
            echo "docker run -d --name gamma -p 9001:9001 -v gamma-data:/data ghcr.io/${REPO,,}:latest"
            echo '```'
            echo
            echo "The image is built from \`main\` by the separate Docker workflow; \`latest\` always tracks the newest merge."
            echo
          } > notes.md
          cat notes.md
      # make_latest keeps this release as the repository's "latest" — the
      # installed apps' updater resolves /releases/latest, so an extension
      # release (published with make_latest=false) must never take it over.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gamma ${{ needs.meta.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ inputs.prerelease != true }}
          files: assets/*
          fail_on_unmatched_files: true
