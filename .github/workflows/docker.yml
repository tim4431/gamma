# Server image only. Runs on every push to main (`latest`) — the only workflow
# a merge triggers; desktop.yml and extension.yml are dispatched by the
# `release` skill. A merge that only touches the account server (cloud/) or
# the website (sites/, PRIVACY.md) does not rebuild it (paths-ignore, the
# same list as check.yml): neither is in this image; cloud.yml and site.yml
# publish those. The desktop release (desktop.yml)
# dispatches this workflow on its new `v<version>` tag with the version as
# input, which adds the `<version>` and `<major.minor>` image tags —
# a `push: tags` trigger would not do it, since tags created with GITHUB_TOKEN
# never trigger workflows. Dispatched on any other branch without a version
# (`gh workflow run docker.yml --ref dev`, the update-demo-server skill) it
# pushes only `sha-<short>`: `latest` is enabled on the default branch alone
# and the semver tags only with a version, so a branch build for the demo
# (demo.gammapdf.com, pinned by that tag) never moves what the NAS pulls.
# Overview: docs/dev/github_actions.md.
name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
      - ".claude/skills/update-account-server/**"
      - ".claude/skills/update-demo-server/**"
      - "docs/dev/cloud_accounts.md"
      - "sites/**"
      - ".github/workflows/site.yml"
      - ".claude/skills/build-site/**"
      - "PRIVACY.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Also tag the image <version> and <major.minor> (set by the desktop release)"
        required: false
        default: ""

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gamma

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the v* tags, for the build stamp

      # The version the server reports (gamma/version.py). A release build
      # carries the dispatched version; every other build is
      # <newest v* tag>-dev.<commits since it> plus the branch it came from,
      # which the server's update check compares against that branch's head.
      - name: Build stamp
        id: stamp
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$tag" ]; then
            echo "version=${tag#v}-dev.$(git rev-list --count "$tag..HEAD")" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GAMMA_VERSION=${{ steps.stamp.outputs.version }}
            GAMMA_BRANCH=${{ steps.stamp.outputs.branch }}
            GAMMA_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
