# The fleet agent (cloud/fleet/), the per-host service that starts, upgrades
# and retires the paid Gamma containers (docs/dev/hosted.md "The agent"):
#
# - a pull request touching cloud/fleet/ runs the agent's tests only;
# - a push to main that touches cloud/fleet/, or a manual dispatch from ANY
#   branch (`gh workflow run fleet.yml --ref dev`), runs the tests, then
#   publishes ghcr.io/<owner>/gamma-fleet:latest and :sha-<short>. The VPS
#   pulls it (cloud/deploy/README.md "Hosted servers").
#
# Overview: docs/dev/github_actions.md.
name: fleet

on:
  pull_request:
    branches: [main]
    paths:
      - "cloud/fleet/**"
      - ".github/workflows/fleet.yml"
  push:
    branches: [main]
    paths:
      - "cloud/fleet/**"
      - ".github/workflows/fleet.yml"
  workflow_dispatch:

concurrency:
  group: fleet-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gamma-fleet

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/fleet/requirements.txt
      - working-directory: cloud/fleet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - working-directory: cloud/fleet
        run: python -m pytest -q

  # One small image, amd64 only: it runs beside the account server.
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: cloud/fleet
          file: cloud/fleet/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fleet
          cache-to: type=gha,mode=max,scope=fleet
      - run: echo "::notice::Published ${{ env.IMAGE_NAME }}:latest from ${{ github.ref_name }} @ ${{ github.sha }}"
