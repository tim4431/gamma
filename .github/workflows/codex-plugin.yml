# The AI assistant plugins (plugins/gamma, tools/*plugins*): the packaging
# and setup tests and the release assets, built on Windows, macOS and Linux
# with a preview version. The release's own are built by desktop.yml's
# plugins job. Overview: docs/dev/github_actions.md.
name: Assistant plugin package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/gamma/**'
      - 'tools/*codex*'
      - 'tools/*dsh*'
      - 'tools/*plugins*'
      - 'tools/marketplace-README.md'
      - 'frontend/src/settings/assistantSetup.js'
      - 'frontend/tests/assistantSetup.test.mjs'
      - 'docs/dev/mcp.md'
      - 'PRIVACY.md'
      - '.github/workflows/codex-plugin.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*codex*.py'
      - run: python -m unittest discover -s tools -p 'test_plugins.py'
      - run: python -m unittest discover -s tools -p 'test_*dsh*.py'
      - run: node --test frontend/tests/assistantSetup.test.mjs
      - run: python tools/release_plugins.py --output dist/plugins --version 0.0.0-preview
      - uses: actions/upload-artifact@v7
        with:
          name: plugins-${{ matrix.os }}
          path: |
            dist/plugins/*.zip
            dist/plugins/*.ps1
            dist/plugins/*.sh
            dist/plugins/*.tgz
            dist/plugins/*SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
