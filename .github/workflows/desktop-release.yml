# Desktop app build + release. Tag `desktop-v*` (e.g. desktop-v0.1.0) to cut a
# GitHub Release with the Windows installer and macOS dmg; run manually
# (workflow_dispatch) to just get build artifacts.
#
# Each installer bundles the frozen backend (PyInstaller) + built frontend, so
# a released app is fully self-contained — end users need no Python or Node.
# macOS builds are unsigned (no Apple Developer ID): first launch needs
# right-click -> Open, or `xattr -dr com.apple.quarantine /Applications/Gamma.app`.

name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # No signing certs configured; keep electron-builder from looking.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Freeze backend
        run: python desktop/build_backend.py

      - name: Smoke-test frozen backend
        shell: bash
        run: |
          BIN=desktop/dist-backend/gamma-server/gamma-server
          [ "$RUNNER_OS" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --port 9317 --data-dir "$RUNNER_TEMP/gamma-smoke" &
          SERVER_PID=$!
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9317/api/health >/dev/null 2>&1; then
              echo "healthy"; kill $SERVER_PID; exit 0
            fi
            sleep 1
          done
          echo "frozen server never became healthy"; kill $SERVER_PID; exit 1

      - name: Build desktop app
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamma-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
