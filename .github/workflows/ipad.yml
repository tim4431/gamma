# The iPad app (ipad/, ipad/README.md): the embedded Python and server
# prepared (ipad/scripts/build-python.sh), the Xcode project generated, the
# unit tests on an iPad simulator, and an unsigned device build. No signing,
# no upload: running on a device takes a developer's own team. The app
# carries the backend and the built web app, so a change to the server's
# dependencies starts this workflow too; the code itself is the one the
# other checks test.
# Overview: docs/dev/github_actions.md.

name: ipad

on:
  pull_request:
    paths:
      - "ipad/**"
      - "backend/requirements.txt"
      - "tools/build_frontend_if_needed.mjs"
      - ".github/workflows/ipad.yml"
  workflow_dispatch:

concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      # pip runs under the device's Python version, so environment markers
      # resolve as they do on the iPad (build-python.sh).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend's packages
        working-directory: frontend
        run: npm ci
      # The support tarball, the pip venv and pip's cache of the iOS wheels.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/gamma-ipad
          key: gamma-ipad-${{ runner.os }}-${{ hashFiles('ipad/scripts/build-python.sh', 'ipad/python/requirements-ios.txt') }}
          restore-keys: gamma-ipad-${{ runner.os }}-
      # Through bash: the script's executable bit does not survive a commit
      # from a Windows checkout.
      - name: Python for iOS, the wheels, the server and the web app
        run: bash ipad/scripts/build-python.sh
      - name: Generate the Xcode project
        working-directory: ipad
        run: |
          brew install xcodegen
          xcodegen generate
      # One architecture: install_python copies the standard library's
      # lib-$ARCHS folder (project.yml), and the runner is Apple Silicon.
      # Besides the pure parts, one test starts the embedded interpreter and
      # waits for the server's /api/health (LocalServerStartTests), so a
      # broken bundle fails here and not on an iPad.
      - name: Unit tests on an iPad simulator
        working-directory: ipad
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ipads = [(rt, d) for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPad")]
          ipads.sort(key=lambda x: x[0])
          print(ipads[-1][1]["udid"])')
          echo "simulator: $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild test -project GammaIPad.xcodeproj -scheme GammaIPad -destination "id=$DEVICE" \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 CODE_SIGNING_ALLOWED=NO | xcbeautify
      # The embedded server's own log, where a failed start's traceback is
      # (gamma_ios.py, PythonRuntime.swift): xcbeautify shows none of it.
      - name: The server's log from the simulator
        if: failure()
        run: |
          data=$(xcrun simctl get_app_container "$DEVICE" net.gammapdf.ipad data 2>/dev/null || true)
          log="$data/Documents/Gamma/local/logs/server.log"
          if [ -f "$log" ]; then tail -c 20000 "$log"; else echo "no server log at $log"; fi
      - name: Device build (unsigned)
        working-directory: ipad
        run: |
          set -o pipefail
          xcodebuild build -project GammaIPad.xcodeproj -scheme GammaIPad -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | xcbeautify
